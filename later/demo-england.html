<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracelog — 旅の記録を、動く物語に</title>

<link href="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.css" rel="stylesheet">

<style>
:root {
  --accent: #ff922b;
  --bg: #0d0f12;
  --panel: #16191d;
  --line: #2a2f36;
  --text: #e9ecef;
  --muted: #868e96;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden;
  font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: var(--bg); color: var(--text); }
button, select, input, textarea { font-family: inherit; }
button { cursor: pointer; }

/* ================= レイアウト ================= */
#app { display: flex; height: 100%; }
#side { width: 348px; flex: none; background: var(--panel);
  border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#mapWrap { flex: 1; position: relative; background: #05070a; }
#map { position: absolute; inset: 0; transition: opacity 1.15s ease; }
body.mode-story #side { display: none; }
body.fade-mode #map { opacity: 0; pointer-events: none; }
body.fade-mode.detail-on #map { opacity: 1; pointer-events: auto; }

/* ================= サイドバー ================= */
#brand { padding: 16px 16px 13px; border-bottom: 1px solid var(--line); }
#brand h1 { margin: 0; font-size: 17px; letter-spacing: .5px; }
#brand p { margin: 3px 0 0; font-size: 11px; color: var(--muted); }
#tripName { width: 100%; margin-top: 11px; padding: 8px 10px; font-size: 13px;
  background: #21262c; border: 1px solid var(--line); border-radius: 6px; color: var(--text); }

/* ================= 検索 ================= */
#searchBox { padding: 10px 10px 0; }
#q { width: 100%; padding: 9px 11px; font-size: 12.5px; background: #21262c;
  border: 1px solid var(--line); border-radius: 7px; color: var(--text); }
#q:focus { outline: none; border-color: var(--accent); }
#qState { font-size: 10.5px; color: var(--muted); padding: 5px 2px 0; min-height: 15px; }
#qResults:not(:empty) { margin-top: 4px; border: 1px solid var(--line);
  border-radius: 7px; overflow: hidden; background: #14181c; }
.qr { padding: 9px 11px; cursor: pointer; border-bottom: 1px solid var(--line); }
.qr:last-child { border-bottom: none; }
.qr:hover { background: #21262c; }
.qr .n { font-size: 12.5px; }
.qr .a { font-size: 10.5px; color: var(--muted); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qr .tag { font-size: 9.5px; color: var(--accent); margin-left: 5px; }

#listWrap { flex: 1; overflow-y: auto; padding: 10px; }
#empty { color: var(--muted); font-size: 12px; text-align: center; padding: 30px 10px; line-height: 1.8; }

.item { background: #21262c; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px; margin-bottom: 8px; }
.item.sel { border-color: var(--accent); }
.item .row { display: flex; align-items: center; gap: 8px; }
.item .no { width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--accent);
  color: #1a1000; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; }
.item .nm { flex: 1; font-size: 13px; font-weight: 600; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .dt { font-size: 11px; color: var(--muted); margin-top: 4px; }
.item .ops { display: flex; gap: 3px; }
.item .ops button { width: 22px; height: 22px; padding: 0; font-size: 11px; line-height: 1;
  background: #2a2f36; border: none; border-radius: 4px; color: var(--muted); }
.item .ops button:hover { background: var(--accent); color: #1a1000; }
.item .thumb { width: 100%; height: 74px; object-fit: cover; border-radius: 5px; margin-top: 8px; display: block; }

/* 到着手段のバッジ */
.legbar { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--muted);
  padding: 3px 0 7px 4px; }
.legbar .ico { font-size: 13px; }
.legbar .via { color: var(--accent); }

.edit { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); }
.edit input[type=text], .edit textarea, .edit select {
  width: 100%; margin-bottom: 6px; padding: 7px 9px; font-size: 12px;
  background: #14181c; border: 1px solid var(--line); border-radius: 5px;
  color: var(--text); font-family: inherit; resize: vertical; }
.edit label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 3px; }
.edit .file { font-size: 11px; color: var(--muted); }
.edit .viaRow { display: flex; gap: 5px; margin-bottom: 6px; }
.edit .viaRow button { flex: 1; padding: 6px; font-size: 11px; background: #2a2f36;
  border: 1px solid var(--line); border-radius: 5px; color: var(--text); }
.edit .viaRow button.armed { background: #2b8a3e; border-color: #2b8a3e; }

#tools { padding: 11px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.btn { padding: 10px; font-size: 13px; border: 1px solid var(--line);
  background: #21262c; color: var(--text); border-radius: 7px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1000; font-weight: 700; }
.btn.armed { background: #2b8a3e; border-color: #2b8a3e; color: #fff; }
.btn.sm { padding: 7px 9px; font-size: 11px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

/* ================= 地図上のピン ================= */
.pin { width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); border: 2.5px solid #fff; color: #1a1000;
  font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.7); cursor: pointer; transition: transform .25s; }
.pin.on { transform: scale(1.5); background: #fff; color: var(--accent); }
.vpin { width: 11px; height: 11px; border-radius: 50%; background: #fff;
  border: 2px solid var(--accent); box-shadow: 0 1px 5px rgba(0,0,0,.7); }

#hint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6;
  background: #2b8a3e; color: #fff; padding: 9px 18px; border-radius: 20px;
  font-size: 12px; box-shadow: 0 3px 14px rgba(0,0,0,.5); display: none; }
body.arming #hint, body.arming-via #hint { display: block; }
body.arming-via #hint::after { content: ''; }

/* ================= 再生中のカード ================= */
#card { position: absolute; left: 26px; bottom: 34px; z-index: 4; width: 310px;
  background: rgba(13,15,18,.9); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; box-shadow: 0 10px 40px rgba(0,0,0,.7); backdrop-filter: blur(8px);
  opacity: 0; transform: translateY(14px); transition: opacity .5s, transform .5s;
  pointer-events: none; }
#card.on { opacity: 1; transform: translateY(0); }
#card .num { font-size: 10px; letter-spacing: 2px; color: var(--accent); }
#card h2 { margin: 5px 0 3px; font-size: 21px; }

/* ================= ストーリーモード ================= */
#story { display: none; position: absolute; inset: 0; z-index: 3; overflow-y: auto; }
body.mode-story #story { display: block; }
body.mode-story #card { display: none; }
#story .inner { width: 100%; max-width: 460px; margin-left: 7vw; padding-bottom: 30vh; }
#story .cover, #story .end { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
#story .cover h1 { font-size: 44px; margin: 0; line-height: 1.25; text-shadow: 0 2px 24px rgba(0,0,0,.9); }
#story .cover p { color: #ced4da; font-size: 13px; letter-spacing: 3px; margin-top: 18px; }
#story .end h2 { font-size: 26px; }

.chap { min-height: 100vh; display: flex; align-items: center; }
.chap .box { background: rgba(13,15,18,.86); border: 1px solid var(--line); border-radius: 14px;
  padding: 26px 28px; backdrop-filter: blur(10px); width: 100%;
  opacity: .16; transform: translateY(24px); transition: opacity .7s, transform .7s; }
.chap.active .box { opacity: 1; transform: translateY(0); }
.chap .num { font-size: 10px; letter-spacing: 3px; color: var(--accent); }
.chap h2 { margin: 7px 0 4px; font-size: 29px; }
.chap .dt { font-size: 11px; color: var(--muted); }
.chap .way { font-size: 11px; color: var(--accent); margin-top: 8px; }
.chap p { font-size: 13.5px; line-height: 2; color: #ced4da; margin: 12px 0 0; white-space: pre-wrap; }
.chap img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-top: 14px; display: block; }
.noimg { width: 100%; height: 200px; border-radius: 10px; margin-top: 14px;
  background: linear-gradient(135deg, #2a2f36, #14181c);
  display: flex; align-items: center; justify-content: center; color: #495057; font-size: 11px; }

#topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 6;
  padding: 12px 18px; display: none; justify-content: space-between; align-items: center;
  background: linear-gradient(rgba(5,7,10,.9), transparent); }
body.mode-story #topbar { display: flex; }
#topbar .ttl { font-size: 13px; font-weight: 600; text-shadow: 0 1px 8px #000; }
#topbar .acts { display: flex; gap: 6px; align-items: stretch; }

select.btn { appearance: none; -webkit-appearance: none; padding-right: 22px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
  background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
select.btn option { background: var(--panel); color: var(--text); }

/* ================= 起動ローダー ================= */
#loader { position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 24px; transition: opacity .8s; }
#loader.gone { opacity: 0; pointer-events: none; }
#loader h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: 1px; }
#loader .tag { font-size: 11px; color: var(--muted); letter-spacing: 3px; margin-bottom: 34px; }
#loader .st { font-size: 13px; margin-bottom: 14px; min-height: 20px; }
#loader .bar { width: 270px; height: 3px; background: #2a2f36; border-radius: 3px; overflow: hidden; }
#loader .bar i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
#loader .cnt { margin-top: 9px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
#loader .skip { margin-top: 30px; background: none; border: 1px solid var(--line);
  color: var(--muted); font-size: 11px; padding: 7px 16px; border-radius: 16px; }
#loader .note { margin-top: 26px; font-size: 10.5px; color: #495057; line-height: 1.9; }

#toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  background: #2b8a3e; color: #fff; padding: 11px 22px; border-radius: 22px;
  font-size: 12.5px; z-index: 60; opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.on { opacity: 1; }
</style>
</head>
<body class="mode-edit">

<div id="app">

  <div id="side">
    <div id="brand">
      <h1>Tracelog</h1>
      <p>旅の記録を、動く物語に</p>
      <input id="tripName" type="text" value="England, 8 months">
    </div>

    <div id="searchBox">
      <input id="q" type="text" placeholder="駅・場所を検索（例: York Station）" autocomplete="off">
      <div id="qState"></div>
      <div id="qResults"></div>
    </div>

    <div id="listWrap">
      <div id="list"></div>
      <div id="empty">まだスポットがありません。<br>上の検索で駅や場所を探すか、<br>「＋ スポットを追加」で地図をクリックしてください。</div>
    </div>

    <div id="tools">
      <button class="btn" id="addBtn">＋ スポットを追加</button>
      <button class="btn primary" id="storyBtn">▶ ストーリーを見る</button>
      <div class="grid2">
        <button class="btn sm" id="shareBtn">共有リンク</button>
        <button class="btn sm" id="saveBtn">JSON保存</button>
      </div>
      <div class="grid2">
        <button class="btn sm" id="loadBtn">JSON読込</button>
        <button class="btn sm" id="sampleBtn">サンプル復元</button>
      </div>
    </div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>
    <div id="hint">地図をクリックしてください（Escで中止）</div>

    <div id="card">
      <div class="num"></div><h2></h2><div class="dt"></div><p></p>
    </div>

    <div id="topbar">
      <div class="ttl"></div>
      <div class="acts">
        <select id="baseStyle" class="btn sm" title="地図の見た目">
          <option value="sat">航空写真</option>
          <option value="std">Standard(3D)</option>
        </select>
        <select id="transMode" class="btn sm" title="スポット間のつなぎ方">
          <option value="fly">つなぎ：経路をたどる</option>
          <option value="fade">つなぎ：フェード</option>
        </select>
        <button class="btn sm" id="playBtn">▶ 自動再生</button>
        <button class="btn sm" id="editBtn">← 編集に戻る</button>
      </div>
    </div>

    <div id="story"><div class="inner" id="storyInner"></div></div>
  </div>

</div>

<!-- 起動時のローディング画面 -->
<div id="loader">
  <h1>Tracelog</h1>
  <div class="tag">ENGLAND, 8 MONTHS</div>
  <div class="st">準備しています</div>
  <div class="bar"><i></i></div>
  <div class="cnt"></div>
  <button class="skip" id="skipBtn">読み込みをスキップ</button>
  <div class="note">
    経路を計算し、旅程上の地図をすべて先に読み込んでいます。<br>
    ここで待つことで、再生中の読み込み待ちがなくなります。
  </div>
</div>

<div id="toast"></div>
<input type="file" id="jsonFile" accept="application/json" style="display:none">

<script src="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.js"></script>
<script src="config.js"></script>
<script>
"use strict";

/* =========================================================
   1. データ
   ---------------------------------------------------------
   mode は「ひとつ前のスポットから、ここへ来た手段」。
   via は鉄道・飛行機で、実際に通った経路を表す経由地。
   ========================================================= */

/* shape:
     'straight' … 点と点を直線で結ぶ（鉄道・バスの乗換駅をつなぐ用途）
     'arc'      … 弧を描く（飛行機）
   api を持つものは Mapbox Directions API で本物の道路をたどる。

   travel … 移動中のカメラ設定。ここが表現の要。
     zoom  … 移動中のいちばん引いた高さ。低いほど地形の細部が見える
     pitch … 傾き。大きいほど「前方を見ながら進む」感じになる
     ms    … 距離あたりの所要時間。小さいほど速い
     min / max … 所要時間の下限・上限
     samples   … 先読みで、この区間の途中を何点読むか

   考え方：
     道路がある区間（車・徒歩・自転車）は、線そのものに情報がある。
     だから低く、ゆっくり進んで、道をなぞるところを見せる。
     直線の区間（鉄道）は途中に見るものが無い。高く、速く通過する。 */
/* look … 進行方向を決めるとき「どれだけ先」を見るか（区間長に対する割合）。
          大きいほど細かい曲がりを無視して、落ち着いた動きになる。 */
const MODES = {
  rail: { label: '鉄道', ico: '🚆', api: null, shape: 'straight',
    travel: { zoom: 8.6, pitch: 46, ms: 5200, min: 3400, max: 7000, samples: 3, look: 0.10 } },

  transit: { label: 'バス', ico: '🚌', api: null, shape: 'straight',
    travel: { zoom: 9.6, pitch: 52, ms: 5600, min: 3400, max: 7000, samples: 3, look: 0.10 } },

  driving: { label: '車', ico: '🚗', api: 'driving',
    travel: { zoom: 11.2, pitch: 60, ms: 15000, min: 6000, max: 16000, samples: 6, look: 0.12 } },

  walking: { label: '徒歩', ico: '🚶', api: 'walking',
    travel: { zoom: 14.8, pitch: 64, ms: 90000, min: 5000, max: 13000, samples: 6, look: 0.10 } },

  cycling: { label: '自転車', ico: '🚴', api: 'cycling',
    travel: { zoom: 13.2, pitch: 62, ms: 34000, min: 5500, max: 14000, samples: 6, look: 0.11 } },

  flight: { label: '飛行機', ico: '✈️', api: null, shape: 'arc', bend: 0.16,
    travel: { zoom: 6.2, pitch: 38, ms: 4000, min: 4000, max: 8000, samples: 3, look: 0.15 } }
};

/* 区間 i（スポット i → i+1）の移動設定。手段は「到着側」が持っている */
function travelFor(i) {
  const next = spots[i + 1];
  const conf = (next && MODES[next.mode]) ? MODES[next.mode] : MODES.rail;
  return conf.travel;
}

/* 区間の長さから所要時間を決める（下限・上限で挟む） */
function travelDuration(i) {
  const t = travelFor(i);
  const leg = legs[i];
  const len = leg ? cumulative(leg)[leg.length - 1] : 0;
  return Math.max(t.min, Math.min(t.max, t.ms * len));
}

/* via は「途中で乗り換えた駅」。検索で追加できる。 */
const SAMPLE = [
  { name: 'London Victoria', date: '2017.09', coord: [-0.1440, 51.4952], mode: 'rail', via: [],
    note: 'ヒースローに降りたのが最初の一歩だった。地下鉄の音、雨の匂い、聞き取れない英語。何もかもが速く流れていた。' },
  { name: 'Brighton', date: '2017.10', coord: [-0.1410, 50.8290], mode: 'rail', via: [],
    note: '電車で1時間、海が見えた。桟橋の先端まで歩いて、そこで初めて自分から誰かに話しかけた。' },
  { name: 'Bath Spa', date: '2017.11', coord: [-2.3570, 51.3775], mode: 'rail',
    via: [[-0.1706, 51.4644], [-0.9720, 51.4590]],   // Clapham Junction → Reading で乗り換え
    note: '石造りの街全体が同じ色をしていた。ローマ人が2000年前に湯を沸かしていた場所に、湯気がまだ立っていた。' },
  { name: 'Oxford', date: '2018.01', coord: [-1.2700, 51.7535], mode: 'driving', via: [],
    note: '自転車と石壁と、古書店の匂い。誰も急いでいなかった。ここで初めて、英語で冗談が通じた。' },
  { name: 'York', date: '2018.03', coord: [-1.0932, 53.9578], mode: 'rail',
    via: [[-1.8996, 52.4778]],                        // Birmingham New Street で乗り換え
    note: '城壁の上を一周した。北へ来るほど言葉が変わっていくのが面白かった。8ヶ月が終わろうとしていた。' }
];

let spots = [];
let tripName = 'England, 8 months';
let selectedId = null;
let markers = [], viaMarkers = [];
let legs = [];              // legs[i] = spot i → i+1 の経路（座標の配列）
let armed = false;          // スポット追加待ち
let armedVia = null;        // 経由地追加待ちのスポットid
let playing = false;
let uid = 1;
let booted = false;

const $ = function (s) { return document.querySelector(s); };
const sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };


/* =========================================================
   2. 地図
   ========================================================= */

mapboxgl.accessToken = MAPBOX_TOKEN;

const STYLES = {
  sat: 'mapbox://styles/mapbox/satellite-streets-v12',
  std: 'mapbox://styles/mapbox/standard'
};
let baseStyle = 'sat';

const STOP_ZOOM = 15.2;    // スポットに着いたときのズーム
const STOP_PITCH = 64;
const TRAVEL_ZOOM = 8.6;   // 移動中のいちばん引いたズーム
const TRAVEL_PITCH = 48;

const map = new mapboxgl.Map({
  container: 'map',
  style: STYLES[baseStyle],
  center: [-1.8, 52.4],
  zoom: 5,
  pitch: 0,
  antialias: true,
  minTileCacheSize: 3000,
  maxTileCacheSize: 6000
});

map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

function isStandard() { return baseStyle === 'std'; }

/* スタイルを切り替えると、独自に足したソースとレイヤーは消える。
   なので style.load のたびに作り直す。 */
map.on('style.load', function () {
  if (isStandard()) {
    map.setConfigProperty('basemap', 'lightPreset', 'dusk');
    map.setConfigProperty('basemap', 'showPointOfInterestLabels', false);
  }

  // 3D地形。航空写真と組み合わせると起伏が出る
  if (!map.getSource('mapbox-dem')) {
    map.addSource('mapbox-dem', {
      type: 'raster-dem', url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
      tileSize: 512, maxzoom: 14
    });
  }
  map.setTerrain({ source: 'mapbox-dem', exaggeration: 1.15 });

  if (!map.getLayer('sky')) {
    map.addLayer({ id: 'sky', type: 'sky',
      paint: { 'sky-type': 'atmosphere', 'sky-atmosphere-sun-intensity': 8 } });
  }

  addRouteLayers();

  if (!booted) { booted = true; bootSequence(); }
  else { drawRoute(routeUpTo(spots.length - 1)); renderMarkers(); }
});

/* ルートの線。3本重ねて「光っている線」に見せる */
function addRouteLayers() {
  if (!map.getSource('route')) {
    map.addSource('route', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
    });
  }
  const slot = isStandard() ? 'middle' : undefined;

  const defs = [
    { id: 'route-glow', width: ['interpolate', ['linear'], ['zoom'], 4, 7, 12, 16],
      color: '#ff922b', opacity: 0.18, blur: 3 },
    { id: 'route-line', width: ['interpolate', ['linear'], ['zoom'], 4, 2.2, 12, 4.5],
      color: '#ffd8a8', opacity: 0.95, blur: 0 }
  ];

  defs.forEach(function (d) {
    if (map.getLayer(d.id)) return;
    const layer = {
      id: d.id, type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': d.color, 'line-width': d.width,
               'line-opacity': d.opacity, 'line-blur': d.blur }
    };
    if (slot) layer.slot = slot;
    map.addLayer(layer);
  });
}

function drawRoute(coords) {
  const src = map.getSource('route');
  if (!src) return;
  src.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords || [] } });
}

function camFor(i) {
  return { center: spots[i].coord, zoom: STOP_ZOOM, pitch: STOP_PITCH, bearing: (i * 41) % 360 };
}


/* =========================================================
   3. 経路の生成
   ---------------------------------------------------------
   ・車 / 徒歩 / 自転車 → Mapbox Directions API（本物の道路）
   ・鉄道 / 飛行機       → Directions API に該当プロファイルが無いため、
                          経由地を通るなめらかな曲線を自前で生成する
   ========================================================= */

/* --- 数学のごく基本的な道具 --- */
function dist(a, b) {
  // 緯度による経度の縮みを補正した、おおまかな距離（度）
  const k = Math.cos((a[1] + b[1]) / 2 * Math.PI / 180);
  const dx = (b[0] - a[0]) * k, dy = b[1] - a[1];
  return Math.sqrt(dx * dx + dy * dy);
}

function bearingOf(a, b) {
  const k = Math.cos((a[1] + b[1]) / 2 * Math.PI / 180);
  return (Math.atan2((b[0] - a[0]) * k, b[1] - a[1]) * 180 / Math.PI + 360) % 360;
}

/* Catmull-Rom スプライン：与えた点を必ず通る、なめらかな曲線 */
function crValue(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t +
    (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}

function smoothThrough(points, perSeg) {
  if (points.length < 2) return points.slice();
  const n = perSeg || 22;
  const P = [points[0]].concat(points, [points[points.length - 1]]);
  const out = [];
  for (let i = 0; i + 3 < P.length; i++) {
    for (let j = 0; j < n; j++) {
      const t = j / n;
      out.push([
        crValue(P[i][0], P[i + 1][0], P[i + 2][0], P[i + 3][0], t),
        crValue(P[i][1], P[i + 1][1], P[i + 2][1], P[i + 3][1], t)
      ]);
    }
  }
  out.push(points[points.length - 1]);
  return out;
}

/* 経由地が無いときに、直線に見えないよう中点を横にずらす（飛行機用） */
function bendMid(a, b, frac) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const dx = b[0] - a[0], dy = b[1] - a[1];
  return [mx - dy * frac, my + dx * frac];
}

/* 直線のまま、点を細かく打ち直す。
   形は直線のままだが、カメラがなめらかに進めるようになる。 */
function densify(points, perSeg) {
  const n = perSeg || 40;
  const out = [];
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    for (let j = 0; j < n; j++) {
      const t = j / n;
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
  }
  out.push(points[points.length - 1]);
  return out;
}

/* --- Directions API --- */
const legCache = {};

async function fetchRoad(profile, points) {
  const coordStr = points.map(function (p) {
    return p[0].toFixed(5) + ',' + p[1].toFixed(5);
  }).join(';');

  const url = 'https://api.mapbox.com/directions/v5/mapbox/' + profile + '/' + coordStr +
    '?geometries=geojson&overview=full&access_token=' + mapboxgl.accessToken;

  const res = await fetch(url);
  if (!res.ok) throw new Error('Directions API: ' + res.status);
  const json = await res.json();
  if (!json.routes || !json.routes.length) throw new Error('経路が見つかりません');
  return json.routes[0].geometry.coordinates;
}

/* spot i → i+1 の経路を1本作る */
async function buildLeg(i) {
  const a = spots[i], b = spots[i + 1];
  const mode = MODES[b.mode] ? b.mode : 'rail';
  const via = (b.via || []);

  const key = mode + '|' + a.coord.join(',') + '|' +
              via.map(function (v) { return v.join(','); }).join(';') + '|' + b.coord.join(',');
  if (legCache[key]) return legCache[key];

  let coords;
  const conf = MODES[mode];

  if (conf.api) {
    // 道路系：本物の道をたどる。25地点までなので経由地は上限を切る
    const pts = [a.coord].concat(via.slice(0, 23), [b.coord]);
    try {
      coords = await fetchRoad(conf.api, pts);
    } catch (err) {
      console.warn('道路経路の取得に失敗したため、直線で代用します', err);
      coords = densify([a.coord].concat(via, [b.coord]));
    }
  } else if (conf.shape === 'arc') {
    // 飛行機：経由地が無ければ弧を描く
    const pts = via.length
      ? [a.coord].concat(via, [b.coord])
      : [a.coord, bendMid(a.coord, b.coord, conf.bend), b.coord];
    coords = smoothThrough(pts);
  } else {
    // 鉄道・バス：乗車駅 → 乗換駅 → 降車駅 を直線で結ぶ
    coords = densify([a.coord].concat(via, [b.coord]));
  }

  legCache[key] = coords;
  return coords;
}

async function buildAllLegs(onProgress) {
  legs = [];
  for (let i = 0; i < spots.length - 1; i++) {
    legs.push(await buildLeg(i));
    if (onProgress) onProgress(i + 1, Math.max(1, spots.length - 1));
  }
}

/* スポット i までの、つながった1本の線 */
function routeUpTo(i) {
  let out = [];
  for (let k = 0; k < i && k < legs.length; k++) {
    out = out.concat(k === 0 ? legs[k] : legs[k].slice(1));
  }
  return out;
}


/* =========================================================
   4. 経路に沿って進むカメラ
   ---------------------------------------------------------
   線の上を、進行方向を向いて移動する。
   出発時に引いて（離陸）、到着時に寄る（着陸）ようズームを変える。
   ========================================================= */

function cumulative(coords) {
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + dist(coords[i - 1], coords[i]));
  return cum;
}

/* 線の始点から d だけ進んだ位置と、そのときの向き */
function alongPath(coords, cum, d) {
  const total = cum[cum.length - 1];
  if (total === 0) return { pt: coords[0], brg: 0, idx: 0 };
  if (d <= 0) return { pt: coords[0], brg: bearingOf(coords[0], coords[1] || coords[0]), idx: 0 };
  if (d >= total) {
    const n = coords.length - 1;
    return { pt: coords[n], brg: bearingOf(coords[n - 1] || coords[n], coords[n]), idx: n };
  }
  let lo = 0, hi = cum.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (cum[mid] <= d) lo = mid; else hi = mid;
  }
  const seg = cum[hi] - cum[lo];
  const t = seg > 0 ? (d - cum[lo]) / seg : 0;
  const a = coords[lo], b = coords[hi];
  return {
    pt: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t],
    brg: bearingOf(a, b),
    idx: lo
  };
}

function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

/* 角度をなめらかにつなぐ（359°→1° が -358 ではなく +2 になるように） */
function lerpAngle(a, b, t) {
  let d = ((b - a + 540) % 360) - 180;
  return a + d * t;
}

/* カメラの向きを落ち着かせるための定数

   FOLLOW_GAIN … 目標の向きへ追いつく速さ（1秒あたり）。小さいほど重たい動き
   MAX_TURN    … 1秒あたりに回ってよい最大角度。急旋回を物理的に禁じる
   DRAW_EVERY  … 経路の線を描き直す間隔(ms)。毎フレームだと重くてちらつく */
const FOLLOW_GAIN = 1.7;
const MAX_TURN = 20;
const DRAW_EVERY = 80;

function flyAlong(coords, duration, startBearing, endBearing, baseCoords, travel) {
  return new Promise(function (resolve) {
    if (!coords || coords.length < 2) { resolve(); return; }

    const tv = travel || { zoom: TRAVEL_ZOOM, pitch: TRAVEL_PITCH };
    const cum = cumulative(coords);
    const total = cum[cum.length - 1];

    // どれだけ先を見るか。目の前の線分ではなく、この距離だけ先の地点を見る。
    // 道路の細かい蛇行は、この「先読み」でならされる。
    const look = Math.max(total * (tv.look || 0.07), 1e-6);

    let curBrg = startBearing;   // 実際にカメラが向いている角度
    let aimBrg = startBearing;   // 向きたい角度
    const t0 = performance.now();
    let lastNow = t0;
    let lastDraw = 0;

    function frame(now) {
      if (!playing) { resolve(); return; }

      // 経過時間。タブ非表示から戻ったときに飛ばないよう上限を設ける
      const dt = Math.min(0.05, Math.max(0.001, (now - lastNow) / 1000));
      lastNow = now;

      let t = (now - t0) / duration;
      if (t > 1) t = 1;
      const e = easeInOut(t);
      const d = e * total;

      const at = alongPath(coords, cum, d);

      // --- ズーム・傾き ---
      const dip = Math.sin(Math.PI * t);
      const zoom = STOP_ZOOM - (STOP_ZOOM - tv.zoom) * dip;
      const pitch = STOP_PITCH - (STOP_PITCH - tv.pitch) * dip;

      // --- 向きたい角度：少し先の地点を見る ---
      const ahead = alongPath(coords, cum, Math.min(total, d + look));
      if (dist(at.pt, ahead.pt) > 1e-9) {
        aimBrg = bearingOf(at.pt, ahead.pt);
      }
      // 終盤は到着時の角度へ寄せていく
      let aim = (t > 0.8) ? lerpAngle(aimBrg, endBearing, (t - 0.8) / 0.2) : aimBrg;

      // --- 減衰しながら追従し、さらに回転速度に上限をかける ---
      let diff = ((aim - curBrg + 540) % 360) - 180;
      let step = diff * Math.min(1, dt * FOLLOW_GAIN);
      const cap = MAX_TURN * dt;
      if (step > cap) step = cap;
      if (step < -cap) step = -cap;
      curBrg = (curBrg + step + 360) % 360;

      map.jumpTo({ center: at.pt, zoom: zoom, pitch: pitch, bearing: curBrg });

      // --- 線を伸ばす。毎フレームは重いので間引く ---
      if (now - lastDraw > DRAW_EVERY || t === 1) {
        drawRoute((baseCoords || []).concat(coords.slice(0, at.idx + 1), [at.pt]));
        lastDraw = now;
      }

      if (t < 1) requestAnimationFrame(frame);
      else resolve();
    }
    requestAnimationFrame(frame);
  });
}


/* =========================================================
   5. 起動シーケンス（ページを開いた時点で全部読む）
   ========================================================= */

let skipped = false;
$('#skipBtn').addEventListener('click', function () { skipped = true; });

function setLoad(msg, n, total) {
  $('#loader .st').textContent = msg;
  if (total) {
    $('#loader .bar i').style.width = (n / total * 100) + '%';
    $('#loader .cnt').textContent = n + ' / ' + total;
  } else {
    $('#loader .cnt').textContent = '';
  }
}

async function bootSequence() {
  const loaded = readHash();
  if (loaded) { spots = loaded.spots; tripName = loaded.name || tripName; }
  else { loadSample(); }
  $('#tripName').value = tripName;
  $('#loader .tag').textContent = tripName.toUpperCase();

  // --- 1) 経路を計算する ---
  setLoad('経路を計算しています', 0, Math.max(1, spots.length - 1));
  await buildAllLegs(function (n, t) { setLoad('経路を計算しています', n, t); });

  renderAll();
  fitAll(0);
  await untilIdle(8000);

  // --- 2) 旅程上の地図をすべて先読みする ---
  if (!skipped) await preloadJourney();

  // --- 3) 出発位置へ ---
  fitAll(0);
  await untilIdle(6000);

  $('#loader').classList.add('gone');
  setTimeout(function () { $('#loader').style.display = 'none'; }, 900);
}

/* 各スポット（寄った状態）＋各区間の途中（引いた状態）を巡ってタイルを読む。
   ★ 区間ごとに移動ズームが違うので、先読みも同じズームで行う。
     ここがずれると、せっかく読んだタイルが再生時に使われない。 */
function preloadTargets() {
  const list = [];
  spots.forEach(function (s, i) { list.push(camFor(i)); });

  legs.forEach(function (coords, i) {
    const tv = travelFor(i);
    const cum = cumulative(coords);
    const total = cum[cum.length - 1];

    // 低く飛ぶ区間ほど多く刻む（見える範囲が狭く、必要なタイルが増えるため）
    const n = tv.samples || 3;
    for (let k = 1; k <= n; k++) {
      const at = alongPath(coords, cum, total * (k / (n + 1)));
      list.push({ center: at.pt, zoom: tv.zoom, pitch: tv.pitch, bearing: at.brg });
    }
  });
  return list;
}

async function preloadJourney() {
  const targets = preloadTargets();
  const back = { center: map.getCenter(), zoom: map.getZoom(),
                 pitch: map.getPitch(), bearing: map.getBearing() };

  for (let i = 0; i < targets.length; i++) {
    if (skipped) break;
    map.jumpTo(targets[i]);
    await untilIdle(7000);
    setLoad('地図を読み込んでいます', i + 1, targets.length);
  }
  map.jumpTo(back);
  await untilIdle(5000);
}

function untilIdle(timeout) {
  return new Promise(function (resolve) {
    if (!map.isMoving() && map.areTilesLoaded()) { resolve(); return; }
    let done = false;
    const finish = function () {
      if (done) return;
      done = true;
      map.off('idle', finish);
      clearTimeout(timer);
      resolve();
    };
    const timer = setTimeout(finish, timeout || 8000);
    map.on('idle', finish);
  });
}

function loadSample() {
  spots = SAMPLE.map(function (s) {
    return { id: uid++, name: s.name, date: s.date, note: s.note,
             coord: s.coord.slice(), mode: s.mode, via: (s.via || []).map(function (v) { return v.slice(); }),
             photo: null };
  });
}


/* =========================================================
   6. 描画
   ========================================================= */

function renderAll() {
  renderList();
  renderMarkers();
  if (!playing) drawRoute(routeUpTo(spots.length - 1));
  renderStory();
  $('#topbar .ttl').textContent = tripName;
}

function renderList() {
  const box = $('#list');
  box.innerHTML = '';
  $('#empty').style.display = spots.length ? 'none' : 'block';

  spots.forEach(function (s, i) {
    // 到着手段のバッジ（2番目以降）
    if (i > 0) {
      const conf = MODES[s.mode] || MODES.rail;
      const bar = document.createElement('div');
      bar.className = 'legbar';
      bar.innerHTML = '<span class="ico">' + conf.ico + '</span><span>' + conf.label + '</span>' +
        (s.via && s.via.length ? '<span class="via">経由地 ' + s.via.length + '</span>' : '');
      box.appendChild(bar);
    }

    const el = document.createElement('div');
    el.className = 'item' + (s.id === selectedId ? ' sel' : '');

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div class="no">' + (i + 1) + '</div><div class="nm"></div>' +
      '<div class="ops"><button data-act="up">↑</button>' +
      '<button data-act="down">↓</button><button data-act="del">×</button></div>';
    row.querySelector('.nm').textContent = s.name || '(名称未設定)';
    el.appendChild(row);

    const dt = document.createElement('div');
    dt.className = 'dt';
    dt.textContent = s.date || '';
    el.appendChild(dt);

    if (s.photo) {
      const img = document.createElement('img');
      img.className = 'thumb'; img.src = s.photo;
      el.appendChild(img);
    }

    if (s.id === selectedId) el.appendChild(buildEditForm(s, i));

    row.querySelector('.nm').addEventListener('click', function () {
      selectedId = (selectedId === s.id) ? null : s.id;
      renderList(); renderMarkers();
      map.flyTo({ center: s.coord, zoom: 13, pitch: 55, duration: 1800, essential: true });
    });

    row.querySelectorAll('.ops button').forEach(function (b) {
      b.addEventListener('click', async function () {
        const act = b.dataset.act;
        if (act === 'del') {
          spots = spots.filter(function (x) { return x.id !== s.id; });
          if (selectedId === s.id) selectedId = null;
        } else if (act === 'up' && i > 0) {
          const t = spots[i - 1]; spots[i - 1] = spots[i]; spots[i] = t;
        } else if (act === 'down' && i < spots.length - 1) {
          const t = spots[i + 1]; spots[i + 1] = spots[i]; spots[i] = t;
        }
        await rebuild();
      });
    });

    box.appendChild(el);
  });

  // 一覧を作り直すとボタンも作り直されるので、経由地モードの見た目を戻す
  if (armedVia) {
    const b = document.querySelector('[data-act=via]');
    if (b) b.classList.add('armed');
  }
}

function buildEditForm(s, index) {
  const f = document.createElement('div');
  f.className = 'edit';

  let modeHtml = '';
  if (index > 0) {
    modeHtml = '<label>ここへ来た手段</label><select data-f="mode">' +
      Object.keys(MODES).map(function (k) {
        return '<option value="' + k + '"' + (s.mode === k ? ' selected' : '') + '>' +
               MODES[k].ico + ' ' + MODES[k].label + '</option>';
      }).join('') + '</select>' +
      '<div class="viaRow">' +
        '<button data-act="via">乗り換えた駅を追加（' + (s.via ? s.via.length : 0) + '）</button>' +
        '<button data-act="clearvia">消す</button>' +
      '</div>';
  }

  f.innerHTML =
    '<label>場所の名前</label><input type="text" data-f="name">' +
    '<label>日付</label><input type="text" data-f="date" placeholder="2017.09">' +
    modeHtml +
    '<label>思い出</label><textarea data-f="note" rows="4"></textarea>' +
    '<label>写真</label><input type="file" class="file" accept="image/*" data-f="photo">';

  f.querySelector('[data-f=name]').value = s.name || '';
  f.querySelector('[data-f=date]').value = s.date || '';
  f.querySelector('[data-f=note]').value = s.note || '';

  f.querySelectorAll('input[type=text], textarea').forEach(function (inp) {
    inp.addEventListener('input', function () {
      s[inp.dataset.f] = inp.value;
      const card = f.closest('.item');
      if (card) {
        if (inp.dataset.f === 'name') card.querySelector('.nm').textContent = inp.value || '(名称未設定)';
        if (inp.dataset.f === 'date') card.querySelector('.dt').textContent = inp.value;
      }
      renderStory();
    });
  });

  const modeSel = f.querySelector('[data-f=mode]');
  if (modeSel) {
    modeSel.addEventListener('change', async function () {
      s.mode = modeSel.value;
      await rebuild();
    });
    f.querySelector('[data-act=via]').addEventListener('click', function () {
      setArmedVia(armedVia === s.id ? null : s.id);
    });
    f.querySelector('[data-act=clearvia]').addEventListener('click', async function () {
      s.via = [];
      await rebuild();
    });
  }

  f.querySelector('[data-f=photo]').addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () { s.photo = reader.result; renderAll(); };
    reader.readAsDataURL(file);
  });

  return f;
}

/* 経路に影響する変更のあとは、経路を作り直してから描き直す */
async function rebuild() {
  await buildAllLegs();
  renderAll();
}

function renderMarkers() {
  markers.forEach(function (m) { m.remove(); });
  viaMarkers.forEach(function (m) { m.remove(); });
  markers = []; viaMarkers = [];

  spots.forEach(function (s, i) {
    const el = document.createElement('div');
    el.className = 'pin' + (s.id === selectedId ? ' on' : '');
    el.textContent = String(i + 1);
    el.addEventListener('click', function () {
      selectedId = s.id;
      renderList(); renderMarkers();
      map.flyTo({ center: s.coord, zoom: 13, pitch: 55, duration: 1500, essential: true });
    });
    markers.push(new mapboxgl.Marker({ element: el, anchor: 'center' })
      .setLngLat(s.coord).addTo(map));

    // 選択中のスポットの経由地だけ、小さな点として見せる
    if (s.id === selectedId && s.via) {
      s.via.forEach(function (v) {
        const ve = document.createElement('div');
        ve.className = 'vpin';
        viaMarkers.push(new mapboxgl.Marker({ element: ve, anchor: 'center' })
          .setLngLat(v).addTo(map));
      });
    }
  });
}

function fitAll(dur) {
  if (!spots.length) return;
  const b = new mapboxgl.LngLatBounds();
  const all = routeUpTo(spots.length - 1);
  (all.length ? all : spots.map(function (s) { return s.coord; }))
    .forEach(function (c) { b.extend(c); });
  map.fitBounds(b, {
    padding: { top: 90, bottom: 90, left: 90, right: 90 },
    duration: (dur === undefined ? 2200 : dur), pitch: 0, bearing: 0
  });
}


/* =========================================================
   7. スポット・経由地の追加
   ========================================================= */

$('#addBtn').addEventListener('click', function () { setArmed(!armed); });

function setArmed(v) {
  armed = v;
  if (v) setArmedVia(null);
  document.body.classList.toggle('arming', armed);
  $('#addBtn').classList.toggle('armed', armed);
  $('#addBtn').textContent = armed ? '✕ 追加をやめる' : '＋ スポットを追加';
  $('#hint').textContent = '地図をクリックしてスポットを追加（Escで中止）';
  map.getCanvas().style.cursor = armed ? 'crosshair' : '';
}

function setArmedVia(id) {
  armedVia = id;
  if (id) setArmedInternal(false);
  document.body.classList.toggle('arming-via', !!id);
  $('#hint').textContent = '乗り換えた駅を、検索するか地図クリックで追加（Escで終了）';
  map.getCanvas().style.cursor = id ? 'crosshair' : '';

  const btn = document.querySelector('[data-act=via]');
  if (btn) btn.classList.toggle('armed', !!id);

  if (id) {
    $('#q').placeholder = '乗り換えた駅を検索（例: Reading Station）';
    $('#q').focus();
  } else {
    $('#q').placeholder = '駅・場所を検索（例: York Station）';
  }
}

function setArmedInternal(v) {
  armed = v;
  document.body.classList.toggle('arming', v);
  $('#addBtn').classList.toggle('armed', v);
  $('#addBtn').textContent = v ? '✕ 追加をやめる' : '＋ スポットを追加';
}

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  setArmed(false);
  setArmedVia(null);
  if (playing) stopPlay();
  skipped = true;
});

map.on('click', async function (e) {
  const c = [Number(e.lngLat.lng.toFixed(5)), Number(e.lngLat.lat.toFixed(5))];

  if (armedVia) {
    const s = spots.find(function (x) { return x.id === armedVia; });
    if (s) {
      if (!s.via) s.via = [];
      s.via.push(c);
      await rebuild();
      toast('経由地を追加しました（' + s.via.length + '）');
    }
    return;
  }

  if (!armed) return;
  const s = { id: uid++, name: '新しいスポット', date: '', note: '',
              coord: c, mode: 'rail', via: [], photo: null };
  spots.push(s);
  selectedId = s.id;
  setArmed(false);
  await rebuild();
  setTimeout(function () { $('#listWrap').scrollTop = $('#listWrap').scrollHeight; }, 50);
});


/* =========================================================
   7-B. 場所の検索（Mapbox Search Box API）
   ---------------------------------------------------------
   Geocoding API v6 が扱う地物は
   country / region / postcode / district / place / locality /
   neighborhood / street / address のみで、POI（駅など）が無い。
   駅名で引くには Search Box API を使う。

   Search Box には2系統ある。
     /suggest + /retrieve … 入力補完向け。session_token 必須。
                            1文字ごとに投げると費用が跳ねる
     /forward             … 単発検索。session_token 不要。1回ごとの課金
   ここでは /forward を使い、さらに「入力が止まってから」投げる。
   ========================================================= */

const SEARCH_WAIT = 500;   // 入力が止まってから投げるまでの待ち時間(ms)
let searchTimer = null;
let searchSeq = 0;

async function searchPlaces(text) {
  const c = map.getCenter();
  const url = 'https://api.mapbox.com/search/searchbox/v1/forward' +
    '?q=' + encodeURIComponent(text) +
    '&language=ja' +
    '&limit=6' +
    '&proximity=' + c.lng.toFixed(4) + ',' + c.lat.toFixed(4) +
    '&access_token=' + mapboxgl.accessToken;

  const res = await fetch(url);
  if (!res.ok) throw new Error('Search Box API: ' + res.status);
  const json = await res.json();

  return (json.features || []).map(function (f) {
    const p = f.properties || {};
    return {
      name: p.name || p.name_preferred || '(名称不明)',
      address: p.place_formatted || p.full_address || '',
      cats: p.poi_category_ids || [],
      coord: f.geometry.coordinates
    };
  });
}

$('#q').addEventListener('input', function () {
  const text = this.value.trim();
  clearTimeout(searchTimer);

  if (text.length < 2) {
    $('#qResults').innerHTML = '';
    $('#qState').textContent = '';
    return;
  }

  $('#qState').textContent = '入力が止まるのを待っています…';
  // ここで待つことで、1文字ごとにAPIを叩くのを防ぐ（費用と負荷の対策）
  searchTimer = setTimeout(function () { runSearch(text); }, SEARCH_WAIT);
});

async function runSearch(text) {
  const my = ++searchSeq;
  $('#qState').textContent = '検索しています…';

  let list;
  try {
    list = await searchPlaces(text);
  } catch (err) {
    console.warn(err);
    $('#qState').textContent = '検索に失敗しました（' + err.message + '）';
    return;
  }
  if (my !== searchSeq) return;   // 新しい入力が来ていたら捨てる

  renderResults(list);
}

function renderResults(list) {
  const box = $('#qResults');
  box.innerHTML = '';

  if (!list.length) {
    $('#qState').textContent = '見つかりませんでした';
    return;
  }

  $('#qState').textContent = armedVia
    ? '選ぶと「乗り換えた駅」として追加されます'
    : '選ぶとスポットとして追加されます';

  list.forEach(function (r) {
    const el = document.createElement('div');
    el.className = 'qr';

    const isStation = r.cats.some(function (c) {
      return /rail|train|station|transit|metro|subway/.test(c);
    });

    const n = document.createElement('div');
    n.className = 'n';
    n.textContent = r.name;
    if (isStation) {
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = '駅';
      n.appendChild(t);
    }

    const a = document.createElement('div');
    a.className = 'a';
    a.textContent = r.address;

    el.appendChild(n);
    el.appendChild(a);
    el.addEventListener('click', function () { pickResult(r); });
    box.appendChild(el);
  });
}

async function pickResult(r) {
  const coord = [Number(r.coord[0].toFixed(5)), Number(r.coord[1].toFixed(5))];

  if (armedVia) {
    // 経由地（乗り換えた駅）として追加
    const s = spots.find(function (x) { return x.id === armedVia; });
    if (s) {
      if (!s.via) s.via = [];
      s.via.push(coord);
      await rebuild();
      toast(r.name + ' を経由地に追加しました');
    }
  } else {
    // 新しいスポットとして追加
    const s = { id: uid++, name: r.name, date: '', note: '',
                coord: coord, mode: 'rail', via: [], photo: null };
    spots.push(s);
    selectedId = s.id;
    await rebuild();
    toast(r.name + ' を追加しました');
    setTimeout(function () { $('#listWrap').scrollTop = $('#listWrap').scrollHeight; }, 50);
  }

  map.flyTo({ center: coord, zoom: 14, pitch: 55, duration: 1800, essential: true });

  $('#q').value = '';
  $('#qResults').innerHTML = '';
  $('#qState').textContent = '';
}


/* =========================================================
   8. ストーリーモード
   ========================================================= */

$('#storyBtn').addEventListener('click', function () { setMode('story'); });
$('#editBtn').addEventListener('click', function () { setMode('edit'); });

function transMode() { return $('#transMode').value; }

async function setMode(m) {
  if (playing) stopPlay();
  const fade = transMode() === 'fade';

  document.body.classList.remove('mode-edit', 'mode-story', 'arming', 'arming-via');
  document.body.classList.add('mode-' + m);
  document.body.classList.toggle('fade-mode', fade);
  armed = false; armedVia = null;
  map.getCanvas().style.cursor = '';
  map.resize();

  if (m === 'story') {
    map.scrollZoom.disable();
    $('#story').scrollTop = 0;
    drawRoute(routeUpTo(spots.length - 1));
    showDetail(!fade);
    fitAll(1500);
    setTimeout(observeChapters, 500);
  } else {
    map.scrollZoom.enable();
    showDetail(true);
    renderAll();
  }
}

function showDetail(on) { document.body.classList.toggle('detail-on', on); }

function renderStory() {
  const box = $('#storyInner');
  box.innerHTML = '';

  const cover = document.createElement('div');
  cover.className = 'cover';
  cover.innerHTML = '<h1></h1><p>SCROLL DOWN ↓</p>';
  cover.querySelector('h1').textContent = tripName;
  box.appendChild(cover);

  spots.forEach(function (s, i) {
    const c = document.createElement('div');
    c.className = 'chap';
    c.dataset.i = String(i);

    const conf = MODES[s.mode] || MODES.rail;
    const inner = document.createElement('div');
    inner.className = 'box';
    inner.innerHTML =
      '<div class="num">CHAPTER ' + String(i + 1).padStart(2, '0') + '</div>' +
      '<h2></h2><div class="dt"></div>' +
      (i > 0 ? '<div class="way">' + conf.ico + '　' + conf.label + 'で移動</div>' : '') +
      '<p></p>';
    inner.querySelector('h2').textContent = s.name || '(名称未設定)';
    inner.querySelector('.dt').textContent = s.date || '';
    inner.querySelector('p').textContent = s.note || '';

    if (s.photo) {
      const img = document.createElement('img'); img.src = s.photo;
      inner.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'noimg';
      ph.textContent = '写真を追加すると、ここに表示されます';
      inner.appendChild(ph);
    }
    c.appendChild(inner);
    box.appendChild(c);
  });

  const end = document.createElement('div');
  end.className = 'end';
  end.innerHTML = '<h2>Thank you for travelling.</h2>' +
    '<p style="color:var(--muted);font-size:12px;margin-top:10px;">Created with Tracelog</p>';
  box.appendChild(end);
}

let observer = null;
let scrollSeq = 0;

async function gotoChapter(i) {
  if (!spots[i]) return;
  const my = ++scrollSeq;

  if (transMode() === 'fade') {
    showDetail(false);
    await sleep(700);
    if (my !== scrollSeq) return;
    map.jumpTo(camFor(i));
    drawRoute(routeUpTo(i));
    await untilIdle(8000);
    if (my !== scrollSeq) return;
    showDetail(true);
  } else {
    const cam = camFor(i);
    cam.duration = 2600; cam.essential = true;
    map.flyTo(cam);
    drawRoute(routeUpTo(i));
  }
}

function observeChapters() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver(function (entries) {
    if (playing) return;
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      document.querySelectorAll('.chap').forEach(function (c) { c.classList.remove('active'); });
      en.target.classList.add('active');
      gotoChapter(Number(en.target.dataset.i));
    });
  }, { root: $('#story'), rootMargin: '-38% 0px -38% 0px', threshold: 0 });

  document.querySelectorAll('.chap').forEach(function (c) { observer.observe(c); });
}


/* =========================================================
   9. 自動再生
   ========================================================= */

const HOLD = 2600;
const FADE = 1150;

$('#playBtn').addEventListener('click', function () {
  if (playing) stopPlay(); else play();
});

function activateChapter(i) {
  const chap = document.querySelector('.chap[data-i="' + i + '"]');
  if (!chap) return;
  document.querySelectorAll('.chap').forEach(function (c) { c.classList.remove('active'); });
  chap.classList.add('active');
  chap.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function play() {
  if (!spots.length) { toast('スポットがありません'); return; }

  playing = true;
  $('#playBtn').textContent = '■ 停止';
  $('#story').style.overflowY = 'hidden';
  document.querySelectorAll('.chap').forEach(function (c) { c.classList.remove('active'); });

  const fade = transMode() === 'fade';

  if (fade) { showDetail(false); await sleep(FADE); }
  else { map.jumpTo(camFor(0)); await untilIdle(6000); }

  for (let i = 0; i < spots.length; i++) {
    if (!playing) break;

    // --- スポットに到着 ---
    activateChapter(i);
    if (fade) {
      map.jumpTo(camFor(i));
      drawRoute(routeUpTo(i));
      await untilIdle(8000);
      if (!playing) break;
      showDetail(true);
      await sleep(FADE);
    } else {
      drawRoute(routeUpTo(i));
    }

    if (!playing) break;

    // その場でゆっくり回す
    map.easeTo({ bearing: camFor(i).bearing + 10, duration: HOLD, essential: true });
    await sleep(HOLD);
    if (!playing) break;

    // --- 次のスポットへ移動 ---
    if (i < spots.length - 1) {
      if (fade) {
        showDetail(false);
        await sleep(FADE);
      } else {
        await flyAlong(
          legs[i],
          travelDuration(i),
          camFor(i).bearing + 10,
          camFor(i + 1).bearing,
          routeUpTo(i),
          travelFor(i)
        );
      }
    }
  }

  if (playing) {
    if (fade) showDetail(false);
    drawRoute(routeUpTo(spots.length - 1));
    fitAll(2800);
    await sleep(2800);
    const end = document.querySelector('#storyInner .end');
    if (end) end.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  stopPlay();
}

function stopPlay() {
  playing = false;
  scrollSeq++;
  $('#playBtn').textContent = '▶ 自動再生';
  $('#story').style.overflowY = 'auto';
  showDetail(true);
}


/* =========================================================
   10. 見た目の切り替え
   ========================================================= */

$('#baseStyle').addEventListener('change', function () {
  if (playing) stopPlay();
  baseStyle = $('#baseStyle').value;
  map.setStyle(STYLES[baseStyle]);   // style.load で作り直される
  toast(baseStyle === 'sat' ? '航空写真に切り替えました' : 'Standard(3D)に切り替えました');
});

$('#transMode').addEventListener('change', function () {
  const fade = transMode() === 'fade';
  document.body.classList.toggle('fade-mode', fade);
  if (playing) stopPlay();
  showDetail(!fade);
  toast(fade ? 'フェード：2状態だけを使います' : '経路をたどる：線の上をカメラが進みます');
});


/* =========================================================
   11. 保存・共有
   ========================================================= */

$('#tripName').addEventListener('input', function () {
  tripName = this.value;
  renderStory();
  $('#topbar .ttl').textContent = tripName;
});

$('#sampleBtn').addEventListener('click', async function () {
  if (!confirm('現在の内容を破棄して、サンプルに戻しますか？')) return;
  tripName = 'England, 8 months';
  $('#tripName').value = tripName;
  selectedId = null;
  loadSample();
  await rebuild();
  fitAll();
});

function encodeState() {
  const lite = spots.map(function (s) {
    return { n: s.name, d: s.date, t: s.note, c: s.coord, m: s.mode, v: s.via || [] };
  });
  const json = JSON.stringify({ name: tripName, s: lite });
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  bytes.forEach(function (b) { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeState(str) {
  try {
    let b = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const bin = atob(b);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const obj = JSON.parse(new TextDecoder().decode(bytes));
    return {
      name: obj.name,
      spots: obj.s.map(function (x) {
        return { id: uid++, name: x.n, date: x.d, note: x.t, coord: x.c,
                 mode: x.m || 'rail', via: x.v || [], photo: null };
      })
    };
  } catch (err) {
    console.warn('共有データを読めませんでした', err);
    return null;
  }
}

function readHash() {
  const h = location.hash.replace(/^#d=/, '');
  if (!h || h === location.hash) return null;
  return decodeState(h);
}

$('#shareBtn').addEventListener('click', function () {
  const code = encodeState();
  const url = location.href.split('#')[0] + '#d=' + code;
  location.hash = 'd=' + code;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(
      function () { toast('共有リンクをコピーしました（写真は含まれません）'); },
      function () { toast('URLバーのアドレスが共有リンクです'); }
    );
  } else {
    toast('URLバーのアドレスが共有リンクです');
  }
});

$('#saveBtn').addEventListener('click', function () {
  const data = JSON.stringify({ name: tripName, spots: spots }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (tripName || 'tracelog').replace(/[^\w\-]+/g, '_') + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('JSONを保存しました');
});

$('#loadBtn').addEventListener('click', function () { $('#jsonFile').click(); });

$('#jsonFile').addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function () {
    try {
      const obj = JSON.parse(reader.result);
      tripName = obj.name || 'My Trip';
      spots = (obj.spots || []).map(function (s) {
        return { id: uid++, name: s.name, date: s.date, note: s.note, coord: s.coord,
                 mode: s.mode || 'rail', via: s.via || [], photo: s.photo || null };
      });
      selectedId = null;
      $('#tripName').value = tripName;
      await rebuild();
      fitAll();
      toast('読み込みました');
    } catch (err) {
      alert('JSONを読み込めませんでした: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});


/* =========================================================
   12. トースト
   ========================================================= */

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2600);
}
</script>
