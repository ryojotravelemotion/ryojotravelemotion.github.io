<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 0 — はじめての地図</title>

<!-- Mapbox の見た目（CSS）を読み込む。これがないとボタン等が崩れます -->
<link href="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.css" rel="stylesheet">

<style>
  /* 画面いっぱいに地図を広げるための最低限のCSS */
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { width: 100%; height: 100%; }
</style>
</head>
<body>

<!-- 地図がここに描かれます。id="map" が目印になります -->
<div id="map"></div>

<!-- Mapbox 本体を読み込む。この行より後で mapboxgl が使えるようになります -->
<script src="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.js"></script>
<!-- 自分のトークン（config.js の中身） -->
<script src="config.js"></script>

<script>
// ============================================
// Step 0: 地図を1枚表示する
// ============================================

// 【1】トークンを Mapbox に渡す
// mapboxgl は、上で読み込んだ Mapbox 本体です。
// その中の accessToken という項目に、自分のトークンを入れます。
mapboxgl.accessToken = MAPBOX_TOKEN;

// 【2】地図を作る
// new mapboxgl.Map( ... ) で地図が1つ生まれます。
// カッコの中の { } は「オブジェクト」といって、設定をまとめて渡す書き方です。
const map = new mapboxgl.Map({
  container: 'map',           // どのHTML要素に描くか（id="map" のこと）
  center: [-0.1276, 51.5072], // 地図の中心。[経度, 緯度] の順（※緯度が先ではない）
  zoom: 10                    // 拡大率。0=地球全体、22=建物レベル
});

// ============================================
// 【JSの文法メモ】
//
// mapboxgl.accessToken = ...
//   「.」は "〜の中の" という意味。
//   mapboxgl の中の accessToken に、= の右側を入れています。
//
// new mapboxgl.Map({ ... })
//   new は「新しく1個作る」という命令。
//   Map は地図の設計図で、new すると実物が1つできます。
//
// { container: 'map', zoom: 10 }
//   オブジェクト。「名前: 値」をカンマ区切りで並べます。
//   設定項目がたくさんある時に、まとめて渡すのに使います。
//
// [-0.1276, 51.5072]
//   配列。値を順番に並べたもの。
//   Mapbox の座標は必ず [経度(longitude), 緯度(latitude)] の順です。
//   Google マップは [緯度, 経度] の順なので、逆です。ここは事故が多い箇所。
// ============================================


// ============================================
// 【やってみよう】
//
// 1. center の数字を変えて、別の街を表示してみる
//      Oxford    → [-1.2577, 51.7520]
//      Bath      → [-2.3590, 51.3811]
//      Brighton  → [-0.1372, 50.8225]
//
// 2. zoom を 3 や 15 に変えて、見え方の違いを確かめる
//
// 3. わざと center の数字を [51.5072, -0.1276] と逆にしてみる
//    → 全然違う場所（インド洋のあたり）に飛びます。
//      「経度が先」を体で覚えるための実験です。
// ============================================
</script>

</body>
</html>
