<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 3 — データをまとめて表示する</title>

<link href="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.css" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { width: 100%; height: 100%; }
  .mapboxgl-popup-content { font-family: sans-serif; font-size: 13px; }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.js"></script>
<script src="config.js"></script>

<script>
// ============================================
// Step 3: 8都市を、コピペせずに一気に表示する
// ============================================

mapboxgl.accessToken = MAPBOX_TOKEN;

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  center: [-1.8, 52.6],
  zoom: 5.5
});


// --- データを1か所にまとめる -----------------------------
// 「コードの中に数字を散らばらせない」のが基本です。
// データ（都市の一覧）と、処理（マーカーを立てる）を分けます。

const cities = [
  { name: 'London',    coord: [-0.1276, 51.5072], note: '最初に着いた街' },
  { name: 'Oxford',    coord: [-1.2577, 51.7520], note: '大学の街' },
  { name: 'Cambridge', coord: [ 0.1218, 52.2053], note: 'パント舟に乗った' },
  { name: 'Bath',      coord: [-2.3590, 51.3811], note: 'ローマ浴場跡' },
  { name: 'Brighton',  coord: [-0.1372, 50.8225], note: '海沿いの街' },
  { name: 'Bristol',   coord: [-2.5879, 51.4545], note: '港町' },
  { name: 'Liverpool', coord: [-2.9916, 53.4084], note: 'ビートルズの街' },
  { name: 'York',      coord: [-1.0873, 53.9600], note: '城壁が残る旧市街' }
];


// --- 全部の都市にマーカーを立てる -------------------------
// forEach は「配列の中身を1つずつ取り出して、同じ処理をする」命令です。
// cities の中身が8個あるので、中の処理が8回動きます。

cities.forEach(function (city) {
  // city には、ループのたびに cities の1つ分が入ります。
  // 1回目は { name: 'London', ... }、2回目は { name: 'Oxford', ... } …

  new mapboxgl.Marker({ color: '#e8590c' })
    .setLngLat(city.coord)   // city の中の coord を取り出す
    .setPopup(
      new mapboxgl.Popup({ offset: 30 })
        .setHTML('<b>' + city.name + '</b><br>' + city.note)
    )
    .addTo(map);
});


// --- 全部の都市が画面に収まるようにカメラを合わせる ---------
// LngLatBounds は「この範囲」を表す入れ物です。
// 各都市を extend で足していくと、全部を含む最小の四角ができます。

const bounds = new mapboxgl.LngLatBounds();

cities.forEach(function (city) {
  bounds.extend(city.coord);
});

// fitBounds で、その範囲がちょうど収まる位置にカメラを動かします。
map.fitBounds(bounds, {
  padding: 60,   // 画面の端から60pxの余白をとる
  duration: 2000 // 2000ミリ秒（2秒）かけて動く
});


// ============================================
// 【JSの文法メモ】
//
// 配列 [ ... ]
//   値を順番に並べたもの。今回は「都市8個のリスト」。
//
// オブジェクト { name: 'London', coord: [...] }
//   名前つきの値の集まり。「1つの都市の情報」をひとまとめにしています。
//   city.name のように「.名前」で中身を取り出します。
//
// 配列の中にオブジェクト [ {...}, {...} ]
//   実務のデータはほぼこの形です。必ず慣れておく形。
//
// forEach(function (city) { ... })
//   配列の中身を1つずつ処理する。
//   function (city) の city は、自分で好きな名前をつけられます
//   （item でも c でも動きます。意味が分かる名前にするのが良い）。
//
// 文字列の連結 '<b>' + city.name + '</b>'
//   + で文字列をつなげられます。
//   モダンな書き方だと `<b>${city.name}</b>` （バッククォート）も使えます。
// ============================================


// ============================================
// 【Mapboxの重要概念：Marker の限界】
//
// Marker は1個ずつHTML要素を作るので、
// 数百〜数千個になると一気に重くなります。
//
// 大量の点を扱うときは Marker ではなく
// 「Source + Layer」という仕組みを使います（Step 6）。
// こちらはGPUで描画するので数万点でも滑らかです。
//
// 使い分け：
//   Marker      … 数十個まで。HTML/CSSで自由にデザインしたい時
//   Source+Layer … 数百個以上。データとして地図に溶け込ませたい時
// ============================================


// ============================================
// 【やってみよう】
//
// 1. cities に自分が行った街を1つ追加する
//    （行を1行足すだけで、マーカーもカメラ範囲も自動で対応します。
//      これが「データと処理を分ける」ことの利点です）
//
// 2. note を消して name だけ表示するように setHTML を書き換える
//
// 3. fitBounds の padding を 200 にして、余白の効果を見る
//
// 4. Marker の color を、city ごとに変えてみる
//    ヒント: cities の各行に color: '#1971c2' を足して、
//           .Marker({ color: city.color }) と書き換える
// ============================================
</script>

</body>
</html>
