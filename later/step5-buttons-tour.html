<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 5 — ボタンで都市を巡る</title>

<link href="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.css" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
  #map { width: 100%; height: 100%; }

  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1;
    background: rgba(255,255,255,0.95); padding: 12px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); max-width: 220px;
  }
  #panel h3 { margin: 0 0 8px; font-size: 14px; }
  #panel button {
    display: block; width: 100%; margin-bottom: 4px; padding: 7px 10px;
    border: 1px solid #ccc; background: #fff; border-radius: 5px;
    cursor: pointer; text-align: left; font-size: 13px;
  }
  #panel button:hover { background: #f1f3f5; }
  #panel button.active { background: #e8590c; color: #fff; border-color: #e8590c; }
  #tour { margin-top: 8px; background: #1971c2 !important; color: #fff !important;
          border-color: #1971c2 !important; text-align: center !important; }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <h3>England 2017</h3>
  <!-- ボタンはJSで自動生成します。ここは空の入れ物 -->
  <div id="buttons"></div>
  <button id="tour">▶ 自動ツアー</button>
</div>

<script src="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.js"></script>
<script src="config.js"></script>

<script>
// ============================================
// Step 5: ボタンを押すと、その街へ飛ぶ
// ============================================

mapboxgl.accessToken = MAPBOX_TOKEN;

const cities = [
  { name: 'London',    coord: [-0.1276, 51.5072], zoom: 12, pitch: 55, bearing:  20 },
  { name: 'Oxford',    coord: [-1.2577, 51.7520], zoom: 14, pitch: 60, bearing: -15 },
  { name: 'Cambridge', coord: [ 0.1218, 52.2053], zoom: 14, pitch: 50, bearing:  40 },
  { name: 'Bath',      coord: [-2.3590, 51.3811], zoom: 15, pitch: 65, bearing:   0 },
  { name: 'Brighton',  coord: [-0.1372, 50.8225], zoom: 13, pitch: 60, bearing: -30 },
  { name: 'York',      coord: [-1.0873, 53.9600], zoom: 14, pitch: 55, bearing:  10 }
];

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  center: [-1.8, 52.6],
  zoom: 5
});


// --- ボタンをJSで作る -------------------------------------
// HTMLに6個ベタ書きせず、データから自動生成します。
// cities に街を足せば、ボタンも自動で増えます。

const buttonsBox = document.getElementById('buttons');

cities.forEach(function (city) {
  const btn = document.createElement('button');
  btn.textContent = city.name;

  // addEventListener('click', 処理)
  //   「このボタンがクリックされたら、この処理をして」という予約
  btn.addEventListener('click', function () {
    goTo(city);
    setActive(btn);
  });

  buttonsBox.appendChild(btn);   // 入れ物の中に実際に差し込む
});


// --- 名前をつけた関数 -------------------------------------
// 同じ処理を何度も使うときは、関数にまとめます。

function goTo(city) {
  map.flyTo({
    center: city.coord,
    zoom: city.zoom,
    pitch: city.pitch,
    bearing: city.bearing,
    duration: 4000,
    essential: true
  });
}

function setActive(btn) {
  // 全ボタンから active を外してから、押されたものだけに付ける
  const all = buttonsBox.querySelectorAll('button');
  all.forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
}


// --- 自動ツアー -------------------------------------------
// 「1都市見せたら、次の都市へ」を順番に繰り返します。

// let は「あとから変わる入れ物」。const との違いはここ。
let tourIndex = 0;
let tourTimer = null;

document.getElementById('tour').addEventListener('click', function () {
  if (tourTimer) {
    // すでにツアー中なら止める
    clearInterval(tourTimer);
    tourTimer = null;
    this.textContent = '▶ 自動ツアー';
    return;   // ここで関数を終了する
  }

  this.textContent = '■ 停止';
  tourIndex = 0;
  goTo(cities[tourIndex]);   // まず最初の1件

  // setInterval: 指定ミリ秒ごとに繰り返し実行する
  tourTimer = setInterval(function () {
    tourIndex = tourIndex + 1;

    if (tourIndex >= cities.length) {
      tourIndex = 0;   // 最後まで行ったら先頭に戻る
    }

    goTo(cities[tourIndex]);
  }, 5500);
});


// ============================================
// 【JSの文法メモ】
//
// function goTo(city) { ... }
//   名前つきの関数。goTo(london) のように呼び出して使います。
//   city は「受け取る値の仮の名前」（引数）。
//
// let と const
//   const … あとで代入し直さないもの（基本はこちら）
//   let  … あとで値が変わるもの（カウンタなど）
//
// cities[0] / cities[1]
//   配列は0番から数えます。cities[0] が London。
//   cities.length は要素数（今回は6）。
//
// if (条件) { ... }
//   条件が成り立つときだけ中を実行する。
//
// return;
//   関数をその場で終わらせる。
//
// addEventListener('click', function () { ... })
//   Step 4 の map.on と同じ考え方。DOM要素版です。
//
// setInterval(処理, ミリ秒)
//   繰り返し実行。止めるには clearInterval(戻り値) が必要。
//   止め忘れると裏で動き続けます（よくあるバグ）。
//
// classList.add / remove
//   HTML要素のclassを付け外しする。CSSと連動させる定番の方法。
// ============================================


// ============================================
// 【やってみよう】
//
// 1. cities に街を1つ追加する（ボタンも自動で増えます）
//
// 2. 各都市の pitch / bearing を変えて、印象の違いを作る
//
// 3. ツアーの間隔 5500 と flyTo の duration 4000 の関係を考える
//    → duration の方を長くするとどうなるか、試してみてください
//
// 4. ボタンを押したとき、その都市の名前を画面に大きく表示する
//    ヒント: <div id="title"></div> をHTMLに足して、
//           goTo の中で document.getElementById('title').textContent = city.name;
// ============================================
</script>

</body>
</html>
