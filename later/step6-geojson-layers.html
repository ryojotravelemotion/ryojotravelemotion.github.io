<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 6 — GeoJSON と Source / Layer（最重要）</title>

<link href="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.css" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
  #map { width: 100%; height: 100%; }
  #replay {
    position: absolute; top: 12px; left: 12px; z-index: 1;
    padding: 9px 16px; border: none; border-radius: 6px;
    background: #1971c2; color: #fff; cursor: pointer; font-size: 13px;
  }
  .mapboxgl-popup-content { font-size: 13px; }
</style>
</head>
<body>

<div id="map"></div>
<button id="replay">↻ ルートをもう一度描く</button>

<script src="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.js"></script>
<script src="config.js"></script>

<script>
// ============================================
// Step 6: GeoJSON と Source / Layer
//
// ここが Mapbox の心臓部です。
// Marker しか知らない人と、ここを理解している人とで、
// 作れるものの幅が決定的に変わります。
// ============================================

mapboxgl.accessToken = MAPBOX_TOKEN;

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  center: [-1.8, 52.4],
  zoom: 5.6
});


// --- 訪問順のデータ ---------------------------------------
const route = [
  { name: 'London',    coord: [-0.1276, 51.5072], month: '9月' },
  { name: 'Brighton',  coord: [-0.1372, 50.8225], month: '10月' },
  { name: 'Bath',      coord: [-2.3590, 51.3811], month: '11月' },
  { name: 'Bristol',   coord: [-2.5879, 51.4545], month: '12月' },
  { name: 'Oxford',    coord: [-1.2577, 51.7520], month: '1月' },
  { name: 'Cambridge', coord: [ 0.1218, 52.2053], month: '2月' },
  { name: 'York',      coord: [-1.0873, 53.9600], month: '3月' },
  { name: 'Liverpool', coord: [-2.9916, 53.4084], month: '4月' }
];


map.on('load', function () {

  // ==========================================
  // 【概念】Source と Layer
  //
  //   Source（ソース）= データそのもの。「どこに何があるか」
  //   Layer（レイヤー）= 描き方。「それをどう見せるか」
  //
  //   1つのSourceに、複数のLayerを重ねられます。
  //   例：同じ都市データに「丸」と「文字」の2レイヤーを重ねる（下でやります）
  //
  //   Mapbox が扱うデータ形式が GeoJSON です。
  //   GeoJSON は世界標準の地理データ形式で、Mapbox 独自ではありません。
  // ==========================================


  // --- 6-A: 点（都市）のSourceを追加 ---------------------
  //
  // GeoJSON の形：
  //   { type: 'FeatureCollection', features: [ ...地物の配列... ] }
  //
  // 1つの地物（Feature）：
  //   { type: 'Feature',
  //     geometry:   { type: 'Point', coordinates: [経度, 緯度] },  ← 場所
  //     properties: { name: 'London' } }                            ← おまけ情報

  const pointFeatures = route.map(function (city, index) {
    // map() は forEach と似ていますが、「変換した新しい配列」を返します。
    // route（都市の配列）→ GeoJSON Feature の配列 に変換しています。
    return {
      type: 'Feature',
      geometry: { type: 'Point', coordinates: city.coord },
      properties: {
        name: city.name,
        month: city.month,
        order: index + 1        // index は 0 から。表示は 1 から始めたいので +1
      }
    };
  });

  map.addSource('cities', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: pointFeatures }
  });


  // --- 6-B: 線（ルート）のSourceを追加 -------------------
  //
  // 最初は空の線にしておき、あとから少しずつ伸ばしてアニメーションさせます。

  map.addSource('route', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: [] }   // 空っぽ
    }
  });


  // --- 6-C: レイヤーを追加していく -----------------------
  // 追加した順に、上に重なっていきます。

  // ルートの線
  map.addLayer({
    id: 'route-line',
    type: 'line',            // 線として描く
    source: 'route',         // どのSourceを使うか
    layout: {
      'line-cap': 'round',
      'line-join': 'round'
    },
    paint: {                 // paint = 色や太さ
      'line-color': '#e8590c',
      'line-width': 3,
      'line-dasharray': [2, 2]
    }
  });

  // 都市の丸
  map.addLayer({
    id: 'city-circles',
    type: 'circle',
    source: 'cities',
    paint: {
      'circle-color': '#fff',
      'circle-stroke-color': '#e8590c',
      'circle-stroke-width': 3,

      // ★ ズームに応じて大きさを変える「式（expression）」
      // interpolate = 値の間をなめらかに補間する
      //   zoom 4 のとき 5px、zoom 12 のとき 14px、その間はなめらかに
      'circle-radius': [
        'interpolate', ['linear'], ['zoom'],
        4, 5,
        12, 14
      ]
    }
  });

  // 都市名の文字（同じ Source 'cities' を使い回します）
  map.addLayer({
    id: 'city-labels',
    type: 'symbol',
    source: 'cities',
    layout: {
      // ['get', 'name'] = そのFeatureの properties.name を取り出す
      'text-field': ['get', 'name'],
      'text-size': 13,
      'text-offset': [0, 1.4],      // 丸の下にずらす
      'text-anchor': 'top'
    },
    paint: {
      'text-color': '#333',
      'text-halo-color': '#fff',    // 文字の白い縁取り。地図では必須級
      'text-halo-width': 2
    }
  });


  // --- 6-D: レイヤーにイベントを付ける -------------------

  // 丸をクリックしたらポップアップ
  map.on('click', 'city-circles', function (e) {
    const props = e.features[0].properties;   // クリックされた地物の情報

    new mapboxgl.Popup()
      .setLngLat(e.lngLat)
      .setHTML('<b>' + props.order + '. ' + props.name + '</b><br>' + props.month)
      .addTo(map);
  });

  // 丸の上でカーソルを指の形にする（触れることを伝えるUI上の配慮）
  map.on('mouseenter', 'city-circles', function () {
    map.getCanvas().style.cursor = 'pointer';
  });
  map.on('mouseleave', 'city-circles', function () {
    map.getCanvas().style.cursor = '';
  });


  // --- 6-E: 線が伸びるアニメーション ---------------------
  drawRoute();
});


// setData でSourceの中身を差し替えると、地図は自動で描き直されます。
// これを少しずつ繰り返すと、線が伸びるアニメーションになります。

let drawTimer = null;

function drawRoute() {
  if (drawTimer) clearInterval(drawTimer);

  let i = 0;
  const drawn = [];   // 描き終わった座標をためていく配列

  drawTimer = setInterval(function () {
    if (i >= route.length) {
      clearInterval(drawTimer);
      drawTimer = null;
      return;
    }

    drawn.push(route[i].coord);   // push = 配列の末尾に追加

    // getSource で追加済みのSourceを取り出し、setData で中身を更新
    map.getSource('route').setData({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: drawn }
    });

    i = i + 1;
  }, 600);
}

document.getElementById('replay').addEventListener('click', drawRoute);


// ============================================
// 【JSの文法メモ】
//
// route.map(function (city, index) { return ... })
//   forEach との違い：map は「変換後の新しい配列」を返します。
//   第2引数の index には、0,1,2… という順番が入ります。
//   ※ Mapboxの map（地図）とは無関係の別物です。名前が同じで紛らわしい箇所。
//
// e.features[0]
//   クリック位置にある地物の配列。[0] は「1つ目」。
//
// drawn.push(...)
//   配列の末尾に要素を足す。
// ============================================


// ============================================
// 【Mapboxの重要概念：式（Expressions）】
//
//   'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 5, 12, 14]
//
// これは Mapbox 独自の「式」という書き方です。
// スタイルの値を、固定値ではなく "データやズームから計算" できます。
//
// よく使う形：
//   ['get', 'name']              … propertiesから値を取る
//   ['interpolate', ...]         … 数値をなめらかに補間する
//   ['step', ...]                … 段階的に切り替える
//   ['case', 条件, 値A, 値B]      … 条件分岐
//   ['match', ['get','type'], 'a','red', 'b','blue', 'gray'] … 値で振り分け
//
// 例：人口に応じて円の大きさを変える
//   'circle-radius': ['interpolate', ['linear'], ['get', 'population'],
//                     1000, 4,  1000000, 30]
//
// 式が書けるようになると、
// 「データが変わればビジュアルも自動で変わる地図」が作れます。
// ここが Mapbox の本当の強みです。
// ============================================


// ============================================
// 【やってみよう】
//
// 1. 'line-dasharray': [2, 2] の行を消して、実線にする
//
// 2. circle-radius の 12, 14 を 12, 30 に変えて、寄ったとき巨大にする
//
// 3. city-labels の text-field を
//    ['concat', ['get','order'], '. ', ['get','name']] に変えて、
//    「1. London」のように番号つきで表示する
//
// 4. addLayer の順番を入れ替えて（線を後にする）、
//    線が丸の上に乗ることを確認する → 重なり順は追加順で決まる
//
// 5. drawRoute の間隔 600 を 100 にして、速さの印象を比べる
// ============================================
</script>

</body>
</html>
