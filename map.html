<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅情マップ — 国土交通省データによる日本の鉄道地図</title>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root {
  --bg:      #f5f1e8;
  --panel:   #fbf8f2;
  --card:    #ffffff;
  --line:    #ded6c7;
  --line2:   #ebe4d8;
  --text:    #1b2a41;
  --muted:   #5f6d7c;
  --accent:  #357a8f;
  --accent-d:#1b4f63;
  --ok:      #4a7c59;
  --shadow:  0 2px 14px rgba(27,42,65,.10);
  --shadow-l:0 18px 50px rgba(15,26,40,.30);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden;
  font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: var(--bg); color: var(--text); }
button, select, input { font-family: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: not-allowed; }

#app { display: flex; height: 100%; }

/* ------------------------------------------------------------ 左パネル */
#side { width: 352px; flex: none; background: var(--panel);
  border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

#brand { padding: 15px 18px 12px; border-bottom: 1px solid var(--line); }
#brand h1 { margin: 0; font-size: 15px; letter-spacing: 2px; font-weight: 600;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; }
#brand p { margin: 5px 0 0; font-size: 10.5px; color: var(--muted); line-height: 1.65; }

#searchWrap { padding: 12px 14px 8px; }
#search { width: 100%; padding: 9px 11px; font-size: 13px; background: var(--card);
  border: 1px solid var(--line); border-radius: 5px; color: var(--text); outline: none; }
#search:focus { border-color: var(--accent); }
#hint { margin: 6px 2px 0; font-size: 10.5px; color: var(--muted); }

#chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 14px 10px;
  border-bottom: 1px solid var(--line); }
.chip { padding: 4px 9px; font-size: 10.5px; border: 1px solid var(--line);
  background: var(--card); border-radius: 999px; color: var(--muted); }
.chip.on { background: var(--accent-d); border-color: var(--accent-d); color: #fff; }

#count { padding: 8px 16px 4px; font-size: 10.5px; color: var(--muted); }

#list { flex: 1; overflow-y: auto; padding: 2px 10px 14px; min-height: 0; }
.row { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  padding: 8px 8px; background: none; border: none; border-radius: 5px; color: var(--text); }
.row:hover { background: var(--line2); }
.row.on { background: var(--card); box-shadow: var(--shadow); }
.swatch { width: 4px; height: 26px; border-radius: 2px; flex: none; }
.rowText { flex: 1; min-width: 0; }
.rowName { font-size: 12.5px; line-height: 1.4; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.rowMeta { font-size: 10px; color: var(--muted); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowHit { font-size: 10px; color: var(--accent); margin-top: 1px; }

#foot { padding: 9px 16px 11px; border-top: 1px solid var(--line);
  font-size: 9.5px; color: var(--muted); line-height: 1.7; }
#foot b { font-weight: 600; color: var(--text); }

/* ------------------------------------------------------------ 地図 */
#mapWrap { flex: 1; position: relative; background: #e6e1d6; min-width: 0; }
#map { position: absolute; inset: 0; }

.float { position: absolute; z-index: 5; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }

#basemaps { top: 12px; right: 12px; display: flex; padding: 3px; gap: 2px; }
#basemaps button { padding: 5px 10px; font-size: 11px; background: none; border: none;
  border-radius: 4px; color: var(--muted); }
#basemaps button.on { background: var(--accent-d); color: #fff; }

#legend { top: 12px; left: 12px; padding: 10px 12px; max-width: 190px; }
#legend h3 { margin: 0 0 7px; font-size: 10px; letter-spacing: 1px; color: var(--muted);
  font-weight: 600; }
.leg { display: flex; align-items: center; gap: 7px; font-size: 10.5px; padding: 1.5px 0; }
.leg i { width: 15px; height: 3px; border-radius: 2px; flex: none; }

#selPanel { bottom: 12px; left: 12px; right: 12px; max-width: 560px;
  padding: 11px 14px; display: none; }
#selPanel.show { display: block; }
#selHead { display: flex; align-items: baseline; gap: 9px; margin-bottom: 7px; }
#selName { font-size: 13.5px; font-weight: 600; }
#selMeta { font-size: 10.5px; color: var(--muted); }
#selClear { margin-left: auto; padding: 3px 10px; font-size: 10.5px; background: var(--card);
  border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
#stations { display: flex; flex-wrap: wrap; gap: 4px; max-height: 92px; overflow-y: auto; }
.st { padding: 3px 8px; font-size: 11px; background: var(--card); border: 1px solid var(--line);
  border-radius: 4px; color: var(--text); }
.st:hover { border-color: var(--accent); }
.st.a { background: var(--accent-d); border-color: var(--accent-d); color: #fff; }
.st.b { background: var(--ok); border-color: var(--ok); color: #fff; }
#segNote { margin-top: 7px; font-size: 10.5px; color: var(--muted); }

#credit { position: absolute; bottom: 4px; right: 8px; z-index: 5; font-size: 9.5px;
  color: #445; background: rgba(251,248,242,.86); padding: 3px 8px; border-radius: 4px; }

#busy { position: absolute; inset: 0; z-index: 9; display: none;
  align-items: center; justify-content: center; background: rgba(245,241,232,.55); }
#busy.on { display: flex; }
#busy span { padding: 9px 18px; font-size: 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }

.maplibregl-popup-content { background: var(--panel); border: 1px solid var(--line);
  border-radius: 5px; padding: 8px 12px; font-size: 12px; color: var(--text);
  box-shadow: var(--shadow); }
.maplibregl-popup-content b { display: block; font-size: 13px; margin-bottom: 2px; }
.maplibregl-popup-content small { color: var(--muted); }
.maplibregl-popup-tip { border-top-color: var(--line) !important; }
.maplibregl-ctrl-attrib { font-size: 10px !important; }

/* ---------------------------------------------- 暗いテーマのときの画面部品 */
body.dark #mapWrap { background: #0d151d; }
body.dark .float { background: rgba(14,23,32,.93); border-color: #2a3a49; color: #dde6ee; }
body.dark #legend h3 { color: #7f94a6; }
body.dark #basemaps button { color: #8ea3b5; }
body.dark #basemaps button.on { background: #2d6f82; color: #fff; }
#basemaps .sep { width: 1px; background: var(--line); margin: 3px 3px; flex: none; }
body.dark #basemaps .sep { background: #2a3a49; }
body.dark #selMeta, body.dark #segNote { color: #8ea3b5; }
body.dark #selClear { background: #16222d; border-color: #2a3a49; color: #8ea3b5; }
body.dark .st { background: #16222d; border-color: #2a3a49; color: #dde6ee; }
body.dark .st:hover { border-color: #5fd3f5; }
body.dark .st.a { background: #2d6f82; border-color: #2d6f82; color: #fff; }
body.dark .st.b { background: #3f7a52; border-color: #3f7a52; color: #fff; }
body.dark #credit { background: rgba(14,23,32,.88); color: #9db0c0; }
body.dark #busy { background: rgba(13,21,29,.55); }
body.dark #busy span { background: #16222d; border-color: #2a3a49; color: #dde6ee; }
body.dark .maplibregl-popup-content { background: #16222d; border-color: #2a3a49; color: #dde6ee; }
body.dark .maplibregl-popup-content small { color: #8ea3b5; }
body.dark .maplibregl-popup-tip { border-top-color: #2a3a49 !important; }

@media (max-width: 760px) {
  #app { flex-direction: column; }
  #side { width: 100%; height: 46%; border-right: none; border-bottom: 1px solid var(--line); }
  #legend { display: none; }
}
</style>
</head>
<body class="dark">

<div id="app">
  <div id="side">
    <div id="brand">
      <h1>旅情マップ</h1>
      <p>国土交通省のデータだけで作った日本の鉄道地図。<br>空中写真・全594路線・8,505駅。</p>
    </div>

    <div id="searchWrap">
      <input id="search" type="search" placeholder="路線名・事業者名・駅名で探す" autocomplete="off">
      <p id="hint">例: 山手線 / 京王 / 出雲市</p>
    </div>

    <div id="chips"></div>
    <div id="count"></div>
    <div id="list"></div>

    <div id="foot">
      出典: <b>国土数値情報（鉄道データ）国土交通省</b><br>
      行政区域: <b>国土数値情報（行政区域データ）国土交通省</b><br>
      空中写真: <b>国土地理院</b>（地理院タイル）
    </div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>

    <div id="basemaps" class="float"></div>

    <div id="legend" class="float">
      <h3>事業者種別</h3>
      <div id="legendBody"></div>
    </div>

    <div id="selPanel" class="float">
      <div id="selHead">
        <span id="selName"></span>
        <span id="selMeta"></span>
        <button id="selClear">閉じる</button>
      </div>
      <div id="stations"></div>
      <p id="segNote">駅を2つ選ぶと、その区間を線路に沿って切り出します。</p>
    </div>

    <div id="credit">地理院タイル（国土地理院） / 国土数値情報（国土交通省）</div>
    <div id="busy"><span>読み込み中…</span></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
"use strict";

/* ============================================================ 定数 */

const DATA = 'data/rail/';

// 地理院タイル。すべて国土地理院が公開しているもの。
// https://maps.gsi.go.jp/development/ichiran.html
// 背景は地理院の空中写真ひとつに絞った。
// 淡色や標準の地図はどう色を調整しても「地図」の顔になるが、
// 写真の上では路線が唯一の作図物になり、いちばん強く出る。
const SAT = {
  url: 'gsiphoto://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
  max: 18
};

// 写真は情報量が多いので、少し彩度と明るさを落としてから線を載せる
const RASTER = {
  'raster-opacity': 1,
  'raster-saturation': -0.3,
  'raster-brightness-max': 0.82,
  // 既定の300msのクロスフェードは、地形の上だと明滅して見える
  'raster-fade-duration': 0
};

const BG = '#0b1620';

// 地理院の標高タイル。
//
// 地理院は独自のPNGエンコードを使っている:
//   標高(m) = (R×65536 + G×256 + B) × 0.01
//   ただし値が 2^23 以上なら 2^24 を引く（負の標高）
//   無効値は (128, 0, 0)
//
// MapLibre が読めるのは terrarium 形式なので、そのままでは使えない。
// 特に無効値をそのまま渡すと標高 83,886m の針が海一面に生えてしまう。
//
// そこで addProtocol でタイルを横取りし、terrarium に詰め直してから渡す。
//   terrarium: 標高(m) = R×256 + G + B/256 − 32768
const DEM = 'https://cyberjapandata.gsi.go.jp/xyz/dem_png/{z}/{x}/{y}.png';
const DEM_MAXZOOM = 14;

/* --- PNGの書き出し ----------------------------------------------------------

   MapLibre は addProtocol の返り値を ArrayBuffer として受け取り、
   `new Blob([new Uint8Array(t)])` で画像に戻す。ImageBitmap は受け付けない。
   つまりタイルは PNG に詰め直して返すしかない。

   ところが canvas.toBlob('image/png') は 256×256 で 約1000ms かかる。
   （OffscreenCanvas.convertToBlob も同じエンコーダで同じ速さだった）
   標高タイルは画面に十数枚並ぶので、これだけで十数秒メインスレッドが止まり、
   地形が遅れて生えては消える「ちらつき」になっていた。

   ここでは PNG を自分で組み立てる。圧縮は一切しない（deflateの無圧縮ブロック）。
   ファイルは192KBと大きくなるが、MapLibreが読み取るまでの一時的なものなので問題ない。
   実測 3.2ms。復号して元の画素と突き合わせ、不一致0を確認している。
   ------------------------------------------------------------------------ */

const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();

function crc32(buf, start, len) {
  let c = 0xFFFFFFFF;
  for (let i = start; i < start + len; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function adler32(buf) {
  let a = 1, b = 0;
  for (let i = 0; i < buf.length; i++) { a = (a + buf[i]) % 65521; b = (b + a) % 65521; }
  return ((b << 16) | a) >>> 0;
}

// RGBAの画素から、無圧縮のPNGを作る。alpha=true なら透明度も残す
function encodePng(data, w, h, alpha) {
  const bpp = alpha ? 4 : 3;
  const raw = new Uint8Array(h * (1 + w * bpp));
  let o = 0;
  for (let y = 0; y < h; y++) {
    raw[o++] = 0;                                  // フィルタなし
    for (let x = 0; x < w; x++) {
      const s = (y * w + x) * 4;
      raw[o++] = data[s]; raw[o++] = data[s + 1]; raw[o++] = data[s + 2];
      if (alpha) raw[o++] = data[s + 3];
    }
  }

  // zlib（無圧縮の格納ブロックだけ）
  const nBlocks = Math.ceil(raw.length / 65535);
  const z = new Uint8Array(2 + nBlocks * 5 + raw.length + 4);
  let q = 0;
  z[q++] = 0x78; z[q++] = 0x01;
  for (let i = 0; i < nBlocks; i++) {
    const off = i * 65535;
    const len = Math.min(65535, raw.length - off);
    z[q++] = (i === nBlocks - 1) ? 1 : 0;
    z[q++] = len & 255; z[q++] = len >> 8;
    z[q++] = (~len) & 255; z[q++] = ((~len) >> 8) & 255;
    z.set(raw.subarray(off, off + len), q); q += len;
  }
  const ad = adler32(raw);
  z[q++] = (ad >>> 24) & 255; z[q++] = (ad >>> 16) & 255;
  z[q++] = (ad >>> 8) & 255;  z[q++] = ad & 255;

  const out = new Uint8Array(8 + 25 + 12 + z.length + 12);
  let k = 0;
  out.set([137, 80, 78, 71, 13, 10, 26, 10], k); k += 8;

  function chunk(type, payload) {
    const len = payload.length;
    out[k++] = (len >>> 24) & 255; out[k++] = (len >>> 16) & 255;
    out[k++] = (len >>> 8) & 255;  out[k++] = len & 255;
    const s = k;
    for (let i = 0; i < 4; i++) out[k++] = type.charCodeAt(i);
    out.set(payload, k); k += len;
    const cc = crc32(out, s, 4 + len);
    out[k++] = (cc >>> 24) & 255; out[k++] = (cc >>> 16) & 255;
    out[k++] = (cc >>> 8) & 255;  out[k++] = cc & 255;
  }

  const ihdr = new Uint8Array(13);
  ihdr[0] = (w >>> 24) & 255; ihdr[1] = (w >>> 16) & 255;
  ihdr[2] = (w >>> 8) & 255;  ihdr[3] = w & 255;
  ihdr[4] = (h >>> 24) & 255; ihdr[5] = (h >>> 16) & 255;
  ihdr[6] = (h >>> 8) & 255;  ihdr[7] = h & 255;
  ihdr[8] = 8; ihdr[9] = alpha ? 6 : 2;            // 8bit / RGB(A)
  chunk('IHDR', ihdr);
  chunk('IDAT', z);
  chunk('IEND', new Uint8Array(0));

  return out.subarray(0, k).buffer;
}

let flatTile = null;

function makeFlatTile() {
  const d = new Uint8ClampedArray(256 * 256 * 4);
  for (let i = 0; i < d.length; i += 4) { d[i] = 128; d[i + 3] = 255; }  // 標高0m
  return encodePng(d, 256, 256);
}

/* --- 空中写真の「写真が無い部分」を透明にする ------------------------------

   地理院の空中写真は日本の周辺しか無く、覆域の外は
   タイル画像そのものが rgb(52,52,52) の灰色で塗りつぶされている。
   （HTTPは200で返るので、タイル欠落として扱うことはできない）

   そのまま出すと、太平洋側に不自然な灰色の帯と三角が出る。
   実測すると無効域は輝度52がタイルの95〜100%を占め、
   実写のニュートラル画素は116〜140（市街）か4〜12（暗い海）で、
   52の周辺には来ない。ここを手がかりに透明へ置き換える。

   無効画素が1つも無いタイル（＝日本の上）は、
   元のJPEGをそのまま返して余計な処理をしない。
   ------------------------------------------------------------------------ */

const NODATA_LO = 46, NODATA_HI = 58, NODATA_SPREAD = 8;

maplibregl.addProtocol('gsiphoto', async function (params, abortController) {
  const url = params.url.replace(/^gsiphoto:\/\//, 'https://');

  let res = null;
  try {
    res = await fetch(url, { signal: abortController.signal });
  } catch (err) { res = null; }

  if (!res || !res.ok) return { data: new ArrayBuffer(0) };   // 空タイル

  const buf = await res.arrayBuffer();
  const bmp = await createImageBitmap(new Blob([buf]));
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0);
  bmp.close();

  const img = ctx.getImageData(0, 0, c.width, c.height);
  const p = img.data;
  let hit = 0;

  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b = p[i + 2];
    if (r < NODATA_LO || r > NODATA_HI) continue;
    const mx = r > g ? (r > b ? r : b) : (g > b ? g : b);
    const mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
    if (mx - mn > NODATA_SPREAD) continue;
    p[i + 3] = 0;
    hit++;
  }

  // 実写のタイルにも、たまたま輝度52の灰色になる画素が僅かにある
  // （実測で富士山0.24%、都心0.00%）。この程度は無効域ではないので、
  // 元のJPEGをそのまま返して変換の手間もデータ量も省く。
  if (hit < c.width * c.height * 0.01) return { data: buf };

  return { data: encodePng(p, c.width, c.height, true) };
});

maplibregl.addProtocol('gsidem', async function (params, abortController) {
  const url = params.url.replace(/^gsidem:\/\//, 'https://');

  let res = null;
  try {
    res = await fetch(url, { signal: abortController.signal });
  } catch (err) { res = null; }

  if (!res || !res.ok) {
    // 日本の外や海上には標高タイルが無い。平らとして扱う。
    if (!flatTile) flatTile = makeFlatTile();
    return { data: flatTile };
  }

  const bmp = await createImageBitmap(await res.blob());
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0);
  bmp.close();

  const img = ctx.getImageData(0, 0, c.width, c.height);
  const p = img.data;

  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b = p[i + 2];
    let h;
    if (r === 128 && g === 0 && b === 0) {
      h = 0;                                       // 無効値
    } else {
      let x = r * 65536 + g * 256 + b;
      if (x >= 8388608) x -= 16777216;             // 負の標高
      h = x * 0.01;
    }
    const v = h + 32768;
    const vi = Math.floor(v);
    p[i]     = Math.max(0, Math.min(255, Math.floor(vi / 256)));
    p[i + 1] = Math.max(0, Math.min(255, vi % 256));
    p[i + 2] = Math.max(0, Math.min(255, Math.round((v - vi) * 256)));
  }

  return { data: encodePng(p, c.width, c.height) };
});

function styleFor() {
  return {
    version: 8,
    sources: {
      gsi: {
        type: 'raster',
        tiles: [SAT.url],
        tileSize: 256,
        maxzoom: SAT.max,
        attribution: GSI_CREDIT +
          ' / 国土数値情報（鉄道データ・行政区域データ）国土交通省'
      },
      terrain: {
        type: 'raster-dem',
        tiles: ['gsidem://cyberjapandata.gsi.go.jp/xyz/dem_png/{z}/{x}/{y}.png'],
        tileSize: 256,
        maxzoom: DEM_MAXZOOM,
        encoding: 'terrarium'
      }
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': BG } },
      { id: 'gsi', type: 'raster', source: 'gsi', paint: RASTER }
    ]
  };
}

/* ============================================================ 起動 */

boot();

async function boot() {
  busy(true);
  try {
    const res = await fetch(DATA + 'index.json');
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    index = await res.json();
  } catch (err) {
    busy(false);
    el('list').innerHTML =
      '<p style="padding:14px;font-size:12px;line-height:1.9;color:#5f6d7c">' +
      'データを読み込めませんでした。<br><br>' +
      '<b>file:// で直接開いていませんか。</b><br>' +
      'ブラウザの制限で、ローカルファイルからはデータを読み込めません。' +
      'サーバー経由で開いてください。<br><br>' +
      'VS Code なら、このフォルダを開いて<b>「Go Live」</b>を押すだけです。<br>' +
      'または <code style="background:#ebe4d8;padding:2px 6px;border-radius:3px">起動.bat</code>' +
      ' をダブルクリックしてください。' +
      '<br><br><small>' + String(err.message) + '</small></p>';
    return;
  }

  OVERLAYS.forEach(function (o) { overlayOn[o.id] = o.on; });

  buildChips();
  buildLegend();
  buildBasemaps();
  render();
  busy(false);

  el('search').addEventListener('input', function (e) {
    query = e.target.value.trim();
    render();
  });
  el('selClear').addEventListener('click', closePanel);
}

function busy(on) { el('busy').classList.toggle('on', on); }

/* ============================================================ 左パネル */

function buildChips() {
  el('chips').innerHTML = FILTERS.map(function (f) {
    return '<button class="chip' + (f.id === filter ? ' on' : '') +
           '" data-f="' + f.id + '">' + f.label + '</button>';
  }).join('');

  [...el('chips').children].forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.dataset.f;
      buildChips();
      render();
    });
  });
}

function buildLegend() {
  el('legendBody').innerHTML = OP_TYPES.map(function (k) {
    return '<div class="leg"><i style="background:' + opColor(k) + '"></i>' + k + '</div>';
  }).join('');
}

// 空中写真には地名も境界も写っていない。
// そこを国土数値情報の行政区域で補う。
async function loadOverlay(o) {
  if (overlayData[o.id]) return overlayData[o.id];
  const res = await fetch(ADMIN + o.file);
  if (!res.ok) throw new Error('行政区域データを読めません: ' + o.file);
  overlayData[o.id] = await res.json();
  return overlayData[o.id];
}

async function syncOverlay(o) {
  if (!overlayOn[o.id]) { setData('admin-' + o.id, empty()); return; }
  try {
    setData('admin-' + o.id, await loadOverlay(o));
  } catch (err) {
    console.warn(err.message);
  }
}

function syncOverlays() { OVERLAYS.forEach(syncOverlay); }

function buildBasemaps() {
  el('basemaps').innerHTML = OVERLAYS.map(function (o) {
    return '<button data-o="' + o.id + '"' + (overlayOn[o.id] ? ' class="on"' : '') +
           '>' + o.label + '</button>';
  }).join('') +
    '<span class="sep"></span>' +
    '<button data-t="1"' + (terrainOn ? ' class="on"' : '') + '>立体</button>';

  [...el('basemaps').querySelectorAll('button')].forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.dataset.t) { toggleTerrain(); return; }
      const o = OVERLAYS.find(function (x) { return x.id === btn.dataset.o; });
      overlayOn[o.id] = !overlayOn[o.id];
      buildBasemaps();
      whenMapReady(function () { syncOverlay(o); });
    });
  });
}

function toggleTerrain() {
  terrainOn = !terrainOn;
  buildBasemaps();

  whenMapReady(function () {
    if (terrainOn) {
      map.setTerrain({ source: 'terrain', exaggeration: 1.4 });
      applySky();
      if (map.getPitch() < 30) {
        map.easeTo({ pitch: 62, duration: 900 });
      }
    } else {
      map.setTerrain(null);
      if (map.setSky) { try { map.setSky(null); } catch (e) {} }
      map.easeTo({ pitch: 0, bearing: 0, duration: 900 });
    }
  });
}

// 立体にすると地平線から先が切れて不自然なので、空と靄を足す。
// setSky は MapLibre の版によって無いことがあるので、無ければ黙って諦める。
function applySky() {
  if (typeof map.setSky !== 'function') return;
  try {
    map.setSky({
      'sky-color': '#0b1a2b',
      'horizon-color': '#3d5f78',
      'fog-color': '#151a17',
      'sky-horizon-blend': 0.6,
      'horizon-fog-blend': 0.55,
      'fog-ground-blend': 0.7
    });
  } catch (e) {
    console.warn('空の設定を適用できませんでした:', e.message);
  }
}

function matches(line) {
  if (filter !== 'all') {
    if (filter === 'shinkansen') { if (line.category !== 'shinkansen') return false; }
    else if (filter === 'tram') { if (line.category !== 'tram') return false; }
    else if (filter === 'other') {
      if (['shinkansen', 'rail', 'tram'].includes(line.category)) return false;
    }
    else if (line.operatorType !== filter) return false;
  }

  if (!query) return true;
  if (line.name.includes(query) || line.operator.includes(query)) return true;
  return line.stations.some(function (s) { return s.includes(query); });
}

function hitLabel(line) {
  if (!query) return '';
  if (line.name.includes(query) || line.operator.includes(query)) return '';
  const hits = line.stations.filter(function (s) { return s.includes(query); });
  return hits.length ? '駅: ' + hits.slice(0, 4).join('、') + (hits.length > 4 ? ' ほか' : '') : '';
}

function render() {
  const found = index.lines.filter(matches);
  el('count').textContent = found.length + ' 路線' + (query ? '（「' + query + '」で絞り込み）' : '');

  const cap = found.slice(0, 300);
  el('list').innerHTML = cap.map(function (l) {
    const hit = hitLabel(l);
    return '<button class="row' + (shown.has(l.id) ? ' on' : '') + '" data-id="' + l.id + '">' +
      '<span class="swatch" style="background:' + opColor(l.operatorType) + '"></span>' +
      '<span class="rowText">' +
        '<span class="rowName">' + esc(l.name) + '</span>' +
        '<span class="rowMeta">' + esc(l.operator) + ' · ' + (CAT_LABEL[l.category] || '') +
          (l.stations.length ? ' · ' + l.stations.length + '駅' : '') + '</span>' +
        (hit ? '<span class="rowHit">' + esc(hit) + '</span>' : '') +
      '</span></button>';
  }).join('') + (found.length > cap.length
    ? '<p style="padding:10px 8px;font-size:10.5px;color:#5f6d7c">ほか ' +
      (found.length - cap.length) + ' 路線。検索で絞り込んでください。</p>' : '');

  [...el('list').querySelectorAll('.row')].forEach(function (b) {
    b.addEventListener('click', function () { toggleLine(b.dataset.id); });
  });
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/* ============================================================ 路線の表示 */

// 地図のスタイルが読み終わる前に操作されると、addSource が失敗して
// 画面が黙って壊れる。準備できるまでの操作はここで待たせる。
let mapReady = false;
const waiting = [];

function whenMapReady(fn) {
  if (mapReady && map.isStyleLoaded()) fn();
  else waiting.push(fn);
}

map.on('load', flushWaiting);
map.on('styledata', flushWaiting);

function flushWaiting() {
  if (!map.isStyleLoaded()) return;

  // styledata はタイルが届くたびに何度も飛んでくる。
  // そのたびに setData をやり直すと、線と駅が消えては出るちらつきになる。
  // 重い作り直しは最初の一度だけにして、以後は待たせた処理を流すだけにする。
  if (!mapReady) {
    mapReady = true;
    ensureLayers();
    redrawAll();
    syncOverlays();
    if (terrainOn && !map.getTerrain()) {
      map.setTerrain({ source: 'terrain', exaggeration: 1.4 });
      applySky();
    }
  }

  while (waiting.length) waiting.shift()();
}

function ensureLayers() {
  if (!map.isStyleLoaded()) return false;

  const t = UI;

  // 行政区域は鉄道より先に追加する（下に敷くため）
  if (!map.getSource('admin-coast')) {
    map.addSource('admin-coast', { type: 'geojson', data: empty() });
    map.addLayer({
      id: 'admin-coast', type: 'line', source: 'admin-coast',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': t.coast,
        'line-opacity': 0.4,
        'line-width': ['interpolate', ['linear'], ['zoom'], 4, 0.5, 10, 1.1]
      }
    });
  }

  if (!map.getSource('admin-border')) {
    map.addSource('admin-border', { type: 'geojson', data: empty() });
    map.addLayer({
      id: 'admin-border', type: 'line', source: 'admin-border',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': t.border,
        'line-opacity': ['interpolate', ['linear'], ['zoom'], 4, 0.28, 8, 0.42, 13, 0.2],
        'line-width': ['interpolate', ['linear'], ['zoom'], 4, 0.6, 9, 1.4, 14, 2.2],
        'line-dasharray': [3, 2]
      }
    });
  }

  if (!map.getSource('admin-label')) {
    map.addSource('admin-label', { type: 'geojson', data: empty() });
    map.addLayer({
      id: 'admin-label', type: 'symbol', source: 'admin-label',
      maxzoom: 11,
      layout: {
        'text-field': ['get', 'name'],
        'text-size': ['interpolate', ['linear'], ['zoom'], 4, 10, 8, 15],
        'text-font': ['Noto Sans Regular'],
        'text-letter-spacing': 0.12,
        'text-allow-overlap': false
      },
      paint: {
        'text-color': '#ffffff',
        'text-opacity': 0.82,
        'text-halo-color': '#11140f',
        'text-halo-width': 1.9
      }
    });
  }

  if (!map.getSource('lines')) {
    map.addSource('lines', { type: 'geojson', data: empty() });

    // 暗いテーマでは、線の下にぼかした同色を敷いて発光しているように見せる
    if (t.glow > 0) {
      map.addLayer({
        id: 'lines-glow', type: 'line', source: 'lines',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': ['get', 'color'],
          'line-opacity': t.glow,
          'line-blur': 6,
          'line-width': ['interpolate', ['linear'], ['zoom'],
            5, ['*', ['get', 'w'], 3], 13, ['*', ['get', 'w'], 6]]
        }
      });
    }

    map.addLayer({
      id: 'lines-casing', type: 'line', source: 'lines',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': t.casing,
        'line-opacity': t.casingOpacity,
        'line-width': ['interpolate', ['linear'], ['zoom'],
          5, ['*', ['get', 'w'], 1.6], 13, ['*', ['get', 'w'], 3.0]]
      }
    });
    map.addLayer({
      id: 'lines-main', type: 'line', source: 'lines',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': ['get', 'color'],
        'line-width': ['interpolate', ['linear'], ['zoom'],
          5, ['get', 'w'], 13, ['*', ['get', 'w'], 2.0]]
      }
    });
  }

  if (!map.getSource('segment')) {
    map.addSource('segment', { type: 'geojson', data: empty() });
    map.addLayer({
      id: 'segment-glow', type: 'line', source: 'segment',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': t.segment, 'line-opacity': 0.3, 'line-width': 13, 'line-blur': 6 }
    });
    map.addLayer({
      id: 'segment-main', type: 'line', source: 'segment',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': t.segment, 'line-width': 4 }
    });
  }

  if (!map.getSource('stations')) {
    map.addSource('stations', { type: 'geojson', data: empty() });
    map.addLayer({
      id: 'stations-dot', type: 'circle', source: 'stations',
      minzoom: 8,
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 8, 2.2, 14, 5],
        'circle-color': t.dot,
        'circle-stroke-color': ['get', 'color'],
        'circle-stroke-width': 1.6
      }
    });
    map.addLayer({
      id: 'stations-label', type: 'symbol', source: 'stations',
      minzoom: 11,
      layout: {
        'text-field': ['get', 'name'],
        'text-size': 11,
        'text-offset': [0, 1.1],
        'text-anchor': 'top',
        'text-font': ['Noto Sans Regular'],
        'text-allow-overlap': false
      },
      paint: {
        'text-color': t.text,
        'text-halo-color': t.halo,
        'text-halo-width': 1.8
      }
    });

    map.on('click', 'stations-dot', function (e) {
      const p = e.features[0].properties;
      new maplibregl.Popup({ closeButton: false, offset: 10 })
        .setLngLat(e.lngLat)
        .setHTML('<b>' + esc(p.name) + '</b><small>' + esc(p.line) + '</small>')
        .addTo(map);
    });
    map.on('mouseenter', 'stations-dot', function () { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'stations-dot', function () { map.getCanvas().style.cursor = ''; });
  }

  return true;
}

function setData(id, data) {
  const src = map.getSource(id);
  if (src) src.setData(data);
}

function empty() { return { type: 'FeatureCollection', features: [] }; }

async function loadLine(id) {
  if (shown.has(id)) return shown.get(id);
  const res = await fetch(DATA + 'lines/' + encodeURIComponent(id) + '.geojson');
  if (!res.ok) throw new Error('路線データを読めません: ' + id);
  return await res.json();
}

async function toggleLine(id) {
  if (shown.has(id)) {
    shown.delete(id);
    if (current && current.meta.id === id) closePanel();
    redrawAll();
    render();
    return;
  }

  busy(true);
  try {
    const gj = await loadLine(id);
    shown.set(id, gj);
    redrawAll();
    render();
    openPanel(id, gj);
    fitTo(id);
  } catch (err) {
    alert(err.message);
  } finally {
    busy(false);
  }
}

function redrawAll() {
  if (!ensureLayers()) return;

  const feats = [];
  const stations = [];

  shown.forEach(function (gj, id) {
    const p = gj.properties;
    const color = opColor(p.operatorType);
    feats.push({
      type: 'Feature',
      properties: { id: id, color: color, w: CAT_WIDTH[p.category] || 2 },
      geometry: gj.geometry
    });

    const meta = index.lines.find(function (l) { return l.id === id; });
    if (meta && stationIndex) {
      meta.stations.forEach(function (name) {
        const entry = (stationIndex[name] || []).find(function (e) { return e.line === id; });
        if (entry) {
          stations.push({
            type: 'Feature',
            properties: { name: name, line: p.operator + ' ' + p.name, color: color },
            geometry: { type: 'Point', coordinates: entry.coord }
          });
        }
      });
    }
  });

  setData('lines', { type: 'FeatureCollection', features: feats });
  setData('stations', { type: 'FeatureCollection', features: stations });
}

function fitTo(id) {
  const meta = index.lines.find(function (l) { return l.id === id; });
  if (!meta) return;
  whenMapReady(function () {
    map.fitBounds([[meta.bbox[0], meta.bbox[1]], [meta.bbox[2], meta.bbox[3]]],
      { padding: { top: 70, bottom: 150, left: 60, right: 60 }, duration: 1100 });
  });
}

/* ============================================================ 詳細パネルと区間切り出し */

async function openPanel(id, gj) {
  const meta = index.lines.find(function (l) { return l.id === id; });
  if (!meta) return;

  if (!stationIndex) {
    try {
      const res = await fetch(DATA + 'stations.json');
      stationIndex = (await res.json()).stations;
      redrawAll();
    } catch (err) { stationIndex = {}; }
  }

  current = { meta: meta, gj: gj };
  pickA = pickB = null;

  el('selName').textContent = meta.name;
  el('selMeta').textContent = meta.operator + ' · ' + (CAT_LABEL[meta.category] || '') +
    ' · ' + meta.stations.length + '駅' +
    (meta.parts > 1 ? ' · ' + meta.parts + '本に分断' : '');

  drawStationChips();
  el('segNote').textContent = '駅を2つ選ぶと、その区間を線路に沿って切り出します。';
  el('selPanel').classList.add('show');
  setData('segment', empty());
}

function drawStationChips() {
  const ordered = orderStations(current.meta, current.gj);
  el('stations').innerHTML = ordered.map(function (n) {
    const cls = n === pickA ? ' a' : (n === pickB ? ' b' : '');
    return '<button class="st' + cls + '" data-n="' + esc(n) + '">' + esc(n) + '</button>';
  }).join('');

  [...el('stations').children].forEach(function (b) {
    b.addEventListener('click', function () { pickStation(b.dataset.n); });
  });
}

// 駅を路線に沿った順に並べる。
//
// N02の区間はファイル順で、地理的な順序になっていない（複線も別々の区間で入る）。
// そのため座標を単純につないだ累積距離では並ばない。線路のグラフ上での距離で測る。
//
// 端の駅は「二重走査」で見つける。適当な駅から最も遠い駅を採り、
// さらにそこから最も遠い駅を採ると、路線の端に辿り着く。
function orderStations(meta, gj) {
  if (!stationIndex) return meta.stations;

  const g = graphFor(meta.id, gj);
  const nodes = [];
  meta.stations.forEach(function (name) {
    const e = (stationIndex[name] || []).find(function (x) { return x.line === meta.id; });
    if (e) nodes.push({ name: name, node: nearestNode(g, e.coord) });
  });
  if (nodes.length < 2) return meta.stations;

  const mid = farthestFrom(g, nodes, nodes[0].node);
  const end = farthestFrom(g, nodes, mid.node);
  const dist = dijkstraFrom(g, end.node).dist;

  return nodes.slice().sort(function (a, b) {
    const da = isFinite(dist[a.node]) ? dist[a.node] : Infinity;
    const db = isFinite(dist[b.node]) ? dist[b.node] : Infinity;
    return da - db;
  }).map(function (s) { return s.name; });
}

function farthestFrom(g, nodes, from) {
  const dist = dijkstraFrom(g, from).dist;
  let best = nodes[0], bd = -1;
  nodes.forEach(function (s) {
    const d = dist[s.node];
    if (isFinite(d) && d > bd) { bd = d; best = s; }
  });
  return best;
}

function pickStation(name) {
  if (pickA === name) { pickA = pickB; pickB = null; }
  else if (pickB === name) { pickB = null; }
  else if (!pickA) { pickA = name; }
  else if (!pickB) { pickB = name; }
  else { pickA = name; pickB = null; }

  drawStationChips();

  if (pickA && pickB) cutSegment();
  else {
    setData('segment', empty());
    el('segNote').textContent = pickA
      ? '「' + pickA + '」を選択中。もう1駅選んでください。'
      : '駅を2つ選ぶと、その区間を線路に沿って切り出します。';
  }
}

function cutSegment() {
  const a = stationCoord(pickA), b = stationCoord(pickB);
  if (!a || !b) { el('segNote').textContent = '駅の座標が見つかりません。'; return; }

  const g = graphFor(current.meta.id, current.gj);
  const na = nearestNode(g, a), nb = nearestNode(g, b);
  if (na < 0 || nb < 0) { el('segNote').textContent = '線路に接続できません。'; return; }

  const path = dijkstra(g, na, nb);
  if (!path) {
    el('segNote').textContent = pickA + ' と ' + pickB +
      ' は、この路線の線形上でつながっていません（分断された路線です）。';
    setData('segment', empty());
    return;
  }

  setData('segment', {
    type: 'Feature', properties: {},
    geometry: { type: 'LineString', coordinates: path.coords }
  });

  el('segNote').textContent = pickA + ' → ' + pickB + '　線路上の距離 約 ' +
    path.km.toFixed(1) + ' km（直線距離 ' + (haversine(a, b) / 1000).toFixed(1) + ' km）';

  const xs = path.coords.map(function (c) { return c[0]; });
  const ys = path.coords.map(function (c) { return c[1]; });
  map.fitBounds([[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]],
    { padding: { top: 70, bottom: 170, left: 60, right: 60 }, duration: 900 });
}

function stationCoord(name) {
  if (!stationIndex) return null;
  const e = (stationIndex[name] || []).find(function (x) { return x.line === current.meta.id; });
  return e ? e.coord : null;
}

function closePanel() {
  current = null; pickA = pickB = null;
  el('selPanel').classList.remove('show');
  setData('segment', empty());
}

/* ============================================================ グラフと最短経路 */

const graphCache = new Map();

function graphFor(id, gj) {
  if (!graphCache.has(id)) graphCache.set(id, buildGraph(gj.geometry.coordinates));
  return graphCache.get(id);
}

function buildGraph(multi) {
  const idx = new Map();
  const pts = [];
  const adj = [];

  function node(c) {
    const k = c[0].toFixed(5) + ',' + c[1].toFixed(5);
    let i = idx.get(k);
    if (i === undefined) { i = pts.length; idx.set(k, i); pts.push(c); adj.push([]); }
    return i;
  }

  multi.forEach(function (seg) {
    for (let i = 1; i < seg.length; i++) {
      const u = node(seg[i - 1]), v = node(seg[i]);
      if (u === v) continue;
      const w = haversine(pts[u], pts[v]);
      adj[u].push([v, w]);
      adj[v].push([u, w]);
    }
  });

  return { pts: pts, adj: adj };
}

function nearestNode(g, c) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < g.pts.length; i++) {
    const d = Math.hypot(g.pts[i][0] - c[0], g.pts[i][1] - c[1]);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

// 二分ヒープ。東北線は1万ノードを超えるので、線形探索では並び順の計算が重すぎる。
function Heap() { this.a = []; }
Heap.prototype.push = function (item) {
  const a = this.a;
  a.push(item);
  let i = a.length - 1;
  while (i > 0) {
    const p = (i - 1) >> 1;
    if (a[p][0] <= a[i][0]) break;
    const t = a[p]; a[p] = a[i]; a[i] = t;
    i = p;
  }
};
Heap.prototype.pop = function () {
  const a = this.a;
  const top = a[0];
  const last = a.pop();
  if (a.length) {
    a[0] = last;
    let i = 0;
    for (;;) {
      const l = i * 2 + 1, r = l + 1;
      let m = i;
      if (l < a.length && a[l][0] < a[m][0]) m = l;
      if (r < a.length && a[r][0] < a[m][0]) m = r;
      if (m === i) break;
      const t = a[m]; a[m] = a[i]; a[i] = t;
      i = m;
    }
  }
  return top;
};

function dijkstraFrom(g, s) {
  const n = g.pts.length;
  const dist = new Float64Array(n).fill(Infinity);
  const prev = new Int32Array(n).fill(-1);
  dist[s] = 0;

  const h = new Heap();
  h.push([0, s]);

  while (h.a.length) {
    const top = h.pop();
    const d = top[0], u = top[1];
    if (d > dist[u]) continue;

    const adj = g.adj[u];
    for (let i = 0; i < adj.length; i++) {
      const v = adj[i][0], nd = d + adj[i][1];
      if (nd < dist[v]) { dist[v] = nd; prev[v] = u; h.push([nd, v]); }
    }
  }

  return { dist: dist, prev: prev };
}

function dijkstra(g, s, t) {
  const r = dijkstraFrom(g, s);
  if (!isFinite(r.dist[t])) return null;

  const coords = [];
  for (let v = t; v >= 0; v = r.prev[v]) coords.push(g.pts[v]);
  coords.reverse();
  return { coords: coords, km: r.dist[t] / 1000 };
}

function haversine(a, b) {
  const R = 6371000;
  const p = Math.PI / 180;
  const dLat = (b[1] - a[1]) * p, dLon = (b[0] - a[0]) * p;
  const s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a[1] * p) * Math.cos(b[1] * p) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * R * Math.asin(Math.sqrt(s));
}
